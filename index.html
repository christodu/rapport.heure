  <style>

                       padding: 12mm !important; background: #fff !important;

    body.apercu .print-break { border-bottom: 1px dashed #B4B2A9; padding-bottom: 18px; margin-bottom: 18px; }


    /* ---- MISE EN PAGE A4 PORTRAIT DU RAPPORT ---- */

    @media print {

      .rapport-compact { border: 1px solid #0A0A0A !important; margin-bottom: 0 !important; }
      .rapport-compact tr { page-break-inside: avoid; }

    .barre-apercu { position: fixed; top: 0; left: 0; right: 0; z-index: 9999;

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
const {
  useState,
  useEffect,
  useRef,
  useCallback
} = React;

// ============================================================
//  MIGRATION — efface l'ancienne liste vide si elle existe
// ============================================================
(function migrateSalaries() {
  try {
    const raw = localStorage.getItem("salaries");
    if (raw === "[]" || raw === null) {
      localStorage.removeItem("salaries");
    }
  } catch (e) {}
})();

// ============================================================
//  CONSTANTES
// ============================================================
const AGENCES = [{
  id: "AG-01",
  nom: "ARPEL",
  couleur: "#1B4F72"
}, {
  id: "AG-02",
  nom: "DEFI",
  couleur: "#B7410E"
}];
const POSTES = ["Chef d'équipe", "Manœuvre"];
const COULEURS_CHANTIER = ["#F5C518", "#E55934", "#3D5A80", "#2A9D8F", "#9B5DE5", "#E67E22"];
// Types d'absence utilisés chez CHOK BÉTON (pas de RTT dans l'entreprise).
/**
 * CONGÉS ET ABSENCES : DEUX CHOSES DIFFÉRENTES
 *
 * Un CONGÉ se décompte du solde annuel : il est posé, accordé, et il
 * diminue les 30 jours auxquels le salarié a droit.
 *
 * Une ABSENCE ne touche pas ce solde. Un arrêt maladie, un accident du
 * travail ou une formation ne coûtent aucun jour de congé au salarié.
 *
 * Les mélanger reviendrait à retirer des jours de vacances à quelqu'un
 * parce qu'il a été malade. La colonne « famille » tranche.
 */
// Pas de RTT chez CHOK'BÉTON : ce motif n'existe pas dans la liste.
const TYPES_ABSENCE = [{
  code: "CP",
  label: "Congés payés",
  couleur: "#2A9D8F",
  icone: "🌴",
  famille: "conge",
  decompte: true
}, {
  code: "SS",
  label: "Congé sans solde",
  couleur: "#7D8CA3",
  icone: "🚪",
  famille: "conge",
  decompte: false
}, {
  code: "MAL",
  label: "Maladie",
  couleur: "#E55934",
  icone: "🏥",
  famille: "absence",
  decompte: false
}, {
  code: "ACC",
  label: "Accident du travail",
  couleur: "#C0392B",
  icone: "⚠️",
  famille: "absence",
  decompte: false
}, {
  code: "ABS",
  label: "Absence injustifiée",
  couleur: "#7F8C8D",
  icone: "❓",
  famille: "absence",
  decompte: false
}, {
  code: "FER",
  label: "Jour férié",
  couleur: "#F5C518",
  icone: "🎉",
  famille: "absence",
  decompte: false
}, {
  code: "FOR",
  label: "Formation",
  couleur: "#9B5DE5",
  icone: "📚",
  famille: "absence",
  decompte: false
}, {
  code: "AUT",
  label: "Autre absence",
  couleur: "#95A5A6",
  icone: "📋",
  famille: "absence",
  decompte: false
}];

/** Ce motif est-il un congé (par opposition à une absence subie) ? */
const estConge = code => (TYPES_ABSENCE.find(t => t.code === code) || {}).famille === "conge";
/** Ce motif retire-t-il des jours au solde annuel ?
    Un congé sans solde n'en retire pas : il n'est pas payé, donc pas décompté. */
const decompteConges = code => !!(TYPES_ABSENCE.find(t => t.code === code) || {}).decompte;

/** Retrouve un type d'absence, même s'il a été retiré de la liste depuis. */
const typeAbsence = code => TYPES_ABSENCE.find(t => t.code === code) || {
  code,
  label: code || "Absence",
  couleur: "#95A5A6",
  icone: "📋",
  famille: "absence",
  decompte: false
};

// ============================================================
//  UTILITAIRES
// ============================================================
const calcHeures = p => {
  const [h1, m1] = p.debut.split(":").map(Number);
  const [h2, m2] = p.fin.split(":").map(Number);
  let min = h2 * 60 + m2 - (h1 * 60 + m1);
  // « <= 0 » et non « < 0 » : une fin identique au début est un poste de
  // 24 h (relève continue), pas une journée vide. Avant ce correctif,
  // saisir 06:00 → 06:00 donnait 0 h et l'heure de paie disparaissait.
  if (min <= 0) min += 1440;
  min -= p.pause || 0;
  return Math.max(0, Math.round(min / 60 * 100) / 100);
};
const calcHSupSemaine = ptgs => {
  const total = ptgs.reduce((s, p) => s + calcHeures(p), 0);
  return Math.max(0, Math.round((total - 35) * 100) / 100);
};
const calcHNuit = p => {
  const [h1, m1] = p.debut.split(":").map(Number);
  const [h2, m2] = p.fin.split(":").map(Number);
  let debutMin = h1 * 60 + m1;
  let finMin = h2 * 60 + m2;
  if (finMin <= debutMin) finMin += 1440; // passage minuit
  // Plages de nuit : 20h-24h (1200-1440) et 00h-06h (0-360 / 1440-1800 normalisé)
  const overlap = (s1, e1, s2, e2) => Math.max(0, Math.min(e1, e2) - Math.max(s1, s2));
  const minNuit = overlap(debutMin, finMin, 1200, 1440) + overlap(debutMin, finMin, 0, 360) + overlap(debutMin, finMin, 1440, 1800);
  return Math.min(Math.round(minNuit / 60 * 100) / 100, calcHeures(p));
};
const fmtH = n => `${Math.floor(n)}h${String(Math.round(n % 1 * 60)).padStart(2, "0")}`;

// ============================================================
//  JOURS FÉRIÉS FRANÇAIS + MAJORATIONS 25 % / 50 % / 100 %
// ============================================================
// Dimanche de Pâques (algorithme de Meeus/Butcher)
function paques(annee) {
  const a = annee % 19,
    b = Math.floor(annee / 100),
    c = annee % 100;
  const d = Math.floor(b / 4),
    e = b % 4,
    f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4),
    k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7,
    m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mois = Math.floor((h + l - 7 * m + 114) / 31),
    jour = (h + l - 7 * m + 114) % 31 + 1;
  return new Date(Date.UTC(annee, mois - 1, jour));
}
const _isoUTC = d => d.toISOString().slice(0, 10);
const _plusJours = (d, n) => {
  const x = new Date(d.getTime());
  x.setUTCDate(x.getUTCDate() + n);
  return x;
};
const _cacheFeries = {};
function feriesAnnee(annee) {
  if (_cacheFeries[annee]) return _cacheFeries[annee];
  const P = paques(annee);
  const liste = {
    [`${annee}-01-01`]: "Jour de l'an",
    [`${annee}-05-01`]: "Fête du travail",
    [`${annee}-05-08`]: "Victoire 1945",
    [`${annee}-07-14`]: "Fête nationale",
    [`${annee}-08-15`]: "Assomption",
    [`${annee}-11-01`]: "Toussaint",
    [`${annee}-11-11`]: "Armistice",
    [`${annee}-12-25`]: "Noël",
    [_isoUTC(_plusJours(P, 1))]: "Lundi de Pâques",
    [_isoUTC(_plusJours(P, 39))]: "Ascension",
    [_isoUTC(_plusJours(P, 50))]: "Lundi de Pentecôte"
  };
  _cacheFeries[annee] = liste;
  return liste;
}
const nomFerie = iso => feriesAnnee(Number(iso.slice(0, 4)))[iso] || null;
const estFerie = iso => !!nomFerie(iso);
const estDimanche = iso => new Date(iso + "T12:00:00Z").getUTCDay() === 0;
const estMajore100 = iso => estDimanche(iso) || estFerie(iso);

// Répartit les heures NETTES d'un pointage sur les jours calendaires
// qu'il traverse (gère les postes à cheval sur minuit).
function heuresParJour(p) {
  const [h1, m1] = p.debut.split(":").map(Number);
  const [h2, m2] = p.fin.split(":").map(Number);
  let d = h1 * 60 + m1,
    f = h2 * 60 + m2;
  if (f <= d) f += 1440;
  const parts = [];
  const finJ1 = Math.min(f, 1440);
  if (finJ1 > d) parts.push({
    date: p.date,
    min: finJ1 - d
  });
  if (f > 1440) parts.push({
    date: _isoUTC(_plusJours(new Date(p.date + "T12:00:00Z"), 1)),
    min: f - 1440
  });
  const brut = parts.reduce((s, x) => s + x.min, 0);
  const net = calcHeures(p); // heures nettes (pause déjà déduite)
  const res = {};
  if (brut <= 0 || net <= 0) return res;
  parts.forEach(x => {
    res[x.date] = (res[x.date] || 0) + net * (x.min / brut);
  });
  return res;
}
// Heures d'un pointage tombant un dimanche ou un jour férié → majorées 100 %
function calcH100(p) {
  let h = 0;
  Object.entries(heuresParJour(p)).forEach(([iso, v]) => {
    if (estMajore100(iso)) h += v;
  });
  return Math.round(h * 100) / 100;
}
// Majorations sur une SEMAINE, pour une personne.
// Règle retenue : dimanche/férié = +100 % exclusif (ces heures ne sont pas
// recomptées dans les paliers 25 % / 50 %).
// Heures ordinaires : 35 h base, de la 36e à la 43e = +25 %, au-delà de 43 h = +50 %.
function calcMajorations(ptgs) {
  let h100 = 0,
    hOrd = 0;
  (ptgs || []).forEach(p => {
    const t = calcHeures(p),
      d = calcH100(p);
    h100 += d;
    hOrd += Math.max(0, t - d);
  });
  const r = n => Math.round(n * 100) / 100;
  const hBase = r(Math.min(hOrd, 35));
  const h25 = r(Math.max(0, Math.min(hOrd - 35, 8)));
  const h50 = r(Math.max(0, hOrd - 43));
  return {
    hBase,
    h25,
    h50,
    h100: r(h100),
    hOrdinaire: r(hOrd),
    total: r(hOrd + h100),
    hSup: r(h25 + h50)
  };
}
// Nuitées : nombre de journées avec déplacement + logement
const calcNuitees = ptgs => (ptgs || []).filter(p => p.deplacement).length;

// ============================================================
//  CODES D'ACCÈS PERSONNELS + SOLDE DE CONGÉS
// ============================================================
// ============================================================
//  LA RÈGLE DES 3 JOURS
//
//  Un chef ne déclare que le jour même, la veille et l'avant-veille.
//  C'est délibéré : au-delà, on ne se souvient plus de l'heure d'arrivée
//  ni de la pause, et les chiffres deviennent des approximations qui
//  finissent en litige de paie.
//
//  Passé ce délai, seule la direction peut saisir — en connaissance de
//  cause, avec le chef au téléphone.
// ============================================================
const JOURS_SAISIE = 3; // aujourd'hui + 2 jours en arrière

/** Date la plus ancienne qu'un chef peut encore saisir. */
function debutSaisie(aujourdIso) {
  const d = new Date((aujourdIso || isoLocalJour(new Date())) + "T12:00:00");
  d.setDate(d.getDate() - (JOURS_SAISIE - 1));
  return isoLocalJour(d);
}

/** Ce jour est-il encore saisissable par un chef ? */
function saisieOuverte(iso, aujourdIso) {
  const auj = aujourdIso || isoLocalJour(new Date());
  return iso >= debutSaisie(auj) && iso <= auj;
}

// ============================================================
//  JOURS SANS HEURES DÉCLARÉES
//
//  Sur un chantier, un rapport oublié se rattrape mal : au bout de
//  quelques semaines plus personne ne se souvient de ce qui a été fait.
//  Mieux vaut le dire tout de suite.
//
//  On ne réclame QUE les jours où la personne était censée travailler :
//   • le dimanche est exclu (majoré à 100 %, donc exceptionnel) ;
//   • les jours fériés sont exclus ;
//   • un congé, un arrêt ou toute absence déclarée exclut le jour ;
//   • le jour même est exclu : on ne déclare qu'en fin de journée.
//
//  Le samedi, lui, est réclamé : il est travaillé chez CHOK'BÉTON.
// ============================================================

/** Cette personne est-elle déclarée absente ce jour-là ? */
function estAbsentLe(absences, personneId, iso) {
  return (absences || []).some(a => a && a.salarie === personneId && String(a.dateDebut || "") <= iso && iso <= String(a.dateFin || a.dateDebut || ""));
}

/**
 * Jours sans heures pour une personne, du plus récent au plus ancien.
 * @param {number} profondeur nombre de jours à examiner avant aujourd'hui
 * @param {string} aujourdIso date du jour (pour pouvoir tester)
 */
function joursSansHeures(pointages, absences, personneId, profondeur, aujourdIso) {
  const auj = aujourdIso || isoLocalJour(new Date());
  const declares = new Set((pointages || []).filter(p => p && p.salarie === personneId).map(p => p.date));
  const manquants = [];
  const d = new Date(auj + "T12:00:00");
  for (let i = 1; i <= (profondeur || 7); i++) {
    const j = new Date(d);
    j.setDate(d.getDate() - i);
    const iso = isoLocalJour(j);
    if (j.getDay() === 0) continue; // dimanche
    if (estFerie(iso)) continue; // jour férié
    if (declares.has(iso)) continue; // heures déjà envoyées
    if (estAbsentLe(absences, personneId, iso)) continue; // congé, arrêt…
    manquants.push(iso);
  }
  return manquants;
}

/** Date de la dernière déclaration d'une personne, ou null. */
function derniereDeclaration(pointages, personneId) {
  const siennes = (pointages || []).filter(p => p && p.salarie === personneId).map(p => p.date).sort();
  return siennes.length ? siennes[siennes.length - 1] : null;
}

/** « lundi 8 septembre » — pour parler des jours en clair. */
const jourEnClair = iso => new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", {
  weekday: "long",
  day: "numeric",
  month: "long"
});

// ============================================================
//  LOGO CHOK'BÉTON
//  Intégré au fichier (aucune image à charger séparément) et réduit à
//  ses trois couleurs : le tout pèse 4 Ko. Le JPEG d'origine traînait

/**
 * CONGÉS PAYÉS — droit annuel et méthode de décompte.
 *
 * Les deux systèmes cohérents en France sont :
 *   • 25 jours OUVRÉS    → on compte lundi→vendredi
 *   • 30 jours OUVRABLES → on compte lundi→SAMEDI  (retenu ici)
 *
 * Mélanger les deux fausse tout : avec un droit de 30 jours mais un décompte
 * en jours ouvrés, une semaine de congés compterait 5 jours au lieu de 6,
 * et le salarié partirait avec ~5 semaines de trop dans l'année.
 * Les jours fériés ne sont jamais décomptés.
 */
const CONGES_DEFAUT = 30; // jours ouvrables par an
const CONGES_MODE = "ouvrables"; // "ouvrables" (lun-sam) ou "ouvres" (lun-ven)
const CONGES_LIBELLE = CONGES_MODE === "ouvrables" ? "jours ouvrables" : "jours ouvrés";
const codeDe = p => p && p.code ? String(p.code) : CODE_DEFAUT;
const congesDe = p => p && p.conges != null && p.conges !== "" ? Number(p.conges) : CONGES_DEFAUT;

// Jours décomptés d'une absence, limités à une année.
// En mode "ouvrables" le samedi compte ; en mode "ouvres" il ne compte pas.
// Le dimanche et les jours fériés ne sont jamais décomptés.
function joursAbsenceAnnee(a, annee) {
  if (!a || !a.dateDebut || !a.dateFin) return 0;
  let n = 0;
  const d1 = new Date(a.dateDebut + "T12:00:00Z"),
    d2 = new Date(a.dateFin + "T12:00:00Z");
  for (let d = new Date(d1.getTime()); d <= d2; d.setUTCDate(d.getUTCDate() + 1)) {
    const iso = _isoUTC(d),
      jour = d.getUTCDay();
    if (annee != null && Number(iso.slice(0, 4)) !== Number(annee)) continue;
    if (jour === 0) continue; // dimanche
    if (jour === 6 && CONGES_MODE !== "ouvrables") continue; // samedi selon le mode
    if (estFerie(iso)) continue; // jour férié
    n++;
  }
  return n;
}
/** Nombre de jours décomptés pour une absence (toutes années confondues). */
const nbJoursDecomptes = a => joursAbsenceAnnee(a, null);

// Jours de congé déjà pris sur une année. On s'appuie sur « decompte »
// plutôt que sur le code « CP » écrit en dur : la règle vit ainsi à un seul
// endroit, et ajouter un motif demain ne fera pas mentir les soldes.
const congesPris = (absences, personneId, annee) => (absences || []).filter(a => a.salarie === personneId && decompteConges(a.type)).reduce((s, a) => s + joursAbsenceAnnee(a, annee), 0);
// Bilan congés : { droit, pris, restant }
function bilanConges(personne, absences, annee) {
  const droit = congesDe(personne);
  const pris = congesPris(absences, personne === null || personne === void 0 ? void 0 : personne.id, annee);
  return {
    droit,
    pris,
    restant: Math.round((droit - pris) * 10) / 10
  };
}

// ============================================================
//  PERSISTANCE localStorage
// ============================================================
function load(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch {
    return fallback;
  }
}
function save(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch {}
}
function usePersist(key, init) {
  const [val, setVal] = useState(() => load(key, init));
  const setter = v => {
    const next = typeof v === "function" ? v(val) : v;
    setVal(next);
    save(key, next);
  };
  return [val, setter];
}

// ============================================================
//  UTILITAIRES SEMAINE ISO
// ============================================================
function infoSemaine(iso) {
  const d = new Date(iso + "T00:00:00");
  const j = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = j.getUTCDay() || 7;
  j.setUTCDate(j.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(j.getUTCFullYear(), 0, 1));
  const numSem = Math.ceil(((j - yearStart) / 86400000 + 1) / 7);
  const annee = j.getUTCFullYear();
  const sem = String(numSem).padStart(2, "0");
  const lundiD = new Date(iso + "T00:00:00");
  lundiD.setDate(lundiD.getDate() - (lundiD.getDay() || 7) + 1);
  // Jusqu'au DIMANCHE, et non au vendredi : le samedi est travaillé et le
  // dimanche est majoré à 100 %. Un libellé s'arrêtant au vendredi laissait
  // croire que le week-end n'était pas compris dans la période.
  const dimancheD = new Date(lundiD);
  dimancheD.setDate(lundiD.getDate() + 6);
  const fmt = x => x.toLocaleDateString("fr-FR", {
    day: "numeric",
    month: "short"
  });
  return {
    annee,
    semaine: numSem,
    cle: `${annee}-S${sem}`,
    label: `S${sem} — ${fmt(lundiD)} au ${fmt(dimancheD)} ${annee}`,
    labelCourt: `S${sem}`,
    moisNum: lundiD.getMonth() + 1,
    moisLabel: lundiD.toLocaleDateString("fr-FR", {
      month: "long",
      year: "numeric"
    }),
    // Format local, jamais toISOString() : celui-ci convertit en UTC, et
    // minuit à Paris devient 22 h la VEILLE. La date reculait d'un jour.
    lundi: isoLocalJour(lundiD),
    dimanche: isoLocalJour(dimancheD)
  };
}
/** Date d'un objet Date au format 'AAAA-MM-JJ', dans le fuseau local. */
function isoLocalJour(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function semaineCouranteCle() {
  return infoSemaine(isoLocalJour(new Date())).cle;
}
function grouperParSemaine(pointages) {
  const map = {};
  pointages.forEach(p => {
    const {
      cle
    } = infoSemaine(p.date);
    if (!map[cle]) map[cle] = [];
    map[cle].push(p);
  });
  return map;
}

//  L'application ne touche JAMAIS aux tables. Elle n'appelle qu'une

/**
 * Nettoie une adresse collée par l'utilisateur : espaces, barre finale,
 * suffixe /rest/v1 copié par erreur depuis le tableau de bord Supabase.
 */
const normaliserUrlApi = u => {
  let s = String(u || "").replace(/\s+/g, "").trim();
  if (!s) return "";
  if (!/^https?:\/\//i.test(s)) s = "https://" + s;
  const i = s.indexOf("/rest/");
  if (i !== -1) s = s.slice(0, i);
  return s.replace(/\/+$/, "");
};

/**
 * ARCHIVER PLUTÔT QUE SUPPRIMER
 *
 * Supprimer une fiche ne supprimait pas ses heures : elles restaient en base
 * mais disparaissaient des rapports, puisque ceux-ci se construisent à partir
 * de la liste des personnes. Un intérimaire retiré le jeudi emportait ainsi
 * ses mardi et mercredi hors de la paie, sans que rien ne le signale.
 *
 * Désormais : une personne ayant des heures ne peut plus être supprimée, elle
 * est archivée. Elle disparaît des listes de saisie et de l'écran de connexion,
 * mais reste sur les rapports.
 */
const estActif = p => !p || p.actif === undefined || p.actif === null || p.actif === true;

/**
 * Tri alphabétique français : « É » se range avec « E », et non à la fin.
 * Appliqué à toute liste de personnes ou de chantiers dès sa réception,
 * pour que l'ordre soit le même partout dans l'application.
 */
const _collateur = typeof Intl !== "undefined" && Intl.Collator ? new Intl.Collator("fr", {
  sensitivity: "base",
  numeric: true
}) : null;
const comparerNoms = (a, b) => _collateur ? _collateur.compare(a || "", b || "") : String(a || "").localeCompare(String(b || ""), "fr");

/**
 * Réveil du serveur — devenu inutile.
 *
 * La base Supabase est allumée en permanence : il n'y a plus de premier
 * appel lent à masquer. La fonction est conservée (sans effet) pour ne
 * pas modifier les endroits qui l'appelaient.
 */
function reveillerServeur() {/* plus de mise en veille : rien à faire */}

// La base répond en 150 à 300 ms. Au-delà de 12 s, c'est le réseau du
// chantier qui manque, pas le serveur : on rend la main sans immobiliser
// l'utilisateur, la file d'attente reprendra seule.
const DELAI_MAX_MS = 12000;
const TENTATIVES = 2;
const pause = ms => new Promise(r => setTimeout(r, ms));

/**
 * Appel au serveur, tolérant aux aléas réseau.
 *
 * Tout passe par l'unique fonction publiée chok_api : l'action et ses
 * paramètres sont transmis tels quels, et le serveur décide de ce qu'il
 * renvoie en fonction du jeton de session.
 *
 * Réessayer est SANS DANGER : chaque ligne porte un identifiant et
 * l'écriture est un « remplacer si existe ». Un rapport envoyé deux fois
 * ne crée pas de doublon, il réécrit simplement la même ligne.
 */
async function api(action, params, options) {
  const url = getApiUrl();
  const cle = getApiKey();
  if (!url || !cle) throw new Error("Adresse ou clé du serveur non renseignée (Paramètres).");
  const opts = options || {};
  const corps = JSON.stringify({
    p: Object.assign({
      action
    }, params || {})
  });
  let dernierEchec = null;
  for (let essai = 1; essai <= (opts.tentatives || TENTATIVES); essai++) {
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    const minuteur = ctrl ? setTimeout(() => ctrl.abort(), opts.delai || DELAI_MAX_MS) : null;
    try {
      const rep = await fetch(url + "/rest/v1/rpc/chok_api", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": cle,
          "Authorization": "Bearer " + cle
        },
        body: corps,
        signal: ctrl ? ctrl.signal : undefined,
        // keepalive : l'envoi se poursuit même si l'utilisateur verrouille
        // son téléphone ou change d'application juste après avoir validé.
        keepalive: corps.length < 60000
      });
      if (minuteur) clearTimeout(minuteur);

      /* ---- Toute réponse en échec est LUE avant d'être signalée ----
         PostgREST écrit la cause exacte dans le corps de la réponse, y
         compris pour les codes 4xx : une erreur de la fonction SQL revient
         en 400. L'ancienne version ne lisait que les 5xx et remplaçait le
         reste par « erreur 400 », phrase aussitôt réécrite plus bas en
         « le serveur n'a pas répondu ». Résultat : toute panne du serveur
         ressemblait à une panne de réseau, et on cherchait au mauvais
         endroit. Désormais le serveur parle, et on le répète mot pour mot. */
      if (!rep.ok) {
        let detail = "";
        try {
          const brut = await rep.text();
          try {
            const b = JSON.parse(brut);
            detail = b.message || b.hint || b.details || b.error_description || b.error || brut;
          } catch (e) {
            detail = brut;
          }
        } catch (e) {}
        detail = String(detail || "").trim().slice(0, 500);
        if (/statement timeout|canceling statement|57014/i.test(detail)) {
          throw Object.assign(new Error("L'opération a dépassé le temps accordé par le serveur.\n\n" + "Relancez CHOK_BETON_SUPABASE.sql : il porte ce délai à 2 minutes."), {
            explicite: true
          });
        }
        if (rep.status === 401 || rep.status === 403) {
          throw Object.assign(new Error("Clé d'accès refusée. Vérifiez la clé « anon » dans Paramètres." + (detail ? "\n\n" + detail : "")), {
            explicite: true
          });
        }
        if (rep.status === 404) {
          throw Object.assign(new Error("Fonction chok_api introuvable : le script SQL n'a pas encore été exécuté dans Supabase."), {
            explicite: true
          });
        }
        const echec = Object.assign(new Error(`Le serveur a refusé l'opération (code ${rep.status}).` + (detail ? "\n\n" + detail : "")), {
          explicite: true,
          statut: rep.status,
          detail
        });
        // Un 5xx peut être passager et mérite une seconde chance ; un 4xx se
        // reproduirait à l'identique, on n'insiste pas.
        if ((rep.status >= 500 || rep.status === 429) && essai < (opts.tentatives || TENTATIVES)) {
          dernierEchec = echec;
          await pause(essai * 800);
          continue;
        }
        throw echec;
      }
      const texte = await rep.text();
      let data;
      try {
        data = JSON.parse(texte);
      } catch (e) {
        throw new Error("Réponse inattendue du serveur. Vérifiez l'adresse du projet dans Paramètres.");
      }
      if (!data || typeof data !== "object") {
        throw new Error("Réponse inattendue du serveur.");
      }
      if (!data.ok) {
        const err = new Error(data.erreur || "Erreur inconnue du serveur.");
        err.codeErreur = data.codeErreur;
        err.expire = data.expire;
        throw err; // refus métier : inutile de réessayer
      }
      return data;
    } catch (e) {
      if (minuteur) clearTimeout(minuteur);
      if (e.codeErreur || e.expire) throw e; // refus du serveur : on n'insiste pas

      /* Une erreur que NOUS avons construite plus haut est définitive : clé
         refusée, fonction absente, réponse 4xx, délai dépassé côté Postgres.
         La réessayer ne fait que doubler l'attente avant le même échec — et,
         sur une opération destructrice, la relancer entièrement. Les seuls
         incidents réessayés sont les 5xx, traités plus haut sans passer ici. */
      if (e.explicite) throw e;
      const abandon = e.name === "AbortError";
      dernierEchec = e;
      if (essai < (opts.tentatives || TENTATIVES)) {
        await pause(essai * 800);
        continue;
      }

      // Message honnête : on distingue l'absence de réseau du serveur muet.
      const horsLigne = typeof navigator !== "undefined" && navigator.onLine === false;
      if (horsLigne) {
        throw new Error("Aucune connexion internet. L'envoi repartira automatiquement.");
      }

      /* Ici, le serveur n'a rien renvoyé du tout : la panne est entre le
         téléphone et lui. On dit laquelle des deux c'est, et on garde la
         trace technique. Sans elle, un blocage du navigateur, une coupure
         de réseau et un délai dépassé donnaient la même phrase — et rien
         ne permettait de savoir laquelle chercher. */
      const secondes = Math.round((opts.delai || DELAI_MAX_MS) / 1000);
      // La version et l'adresse font partie du diagnostic : sans elles, on ne
      // peut pas distinguer « le serveur a un problème » de « le téléphone
      // fait encore tourner l'ancienne version de l'application ».
      const technique = `${e.name || "Erreur"} : ${e.message || "sans message"}` + `\nApplication ${APP_VERSION} · action « ${action} »` + `\nAdresse appelée : ${url}/rest/v1/rpc/chok_api`;
      throw Object.assign(new Error((abandon ? `Le serveur n'a pas répondu dans le temps imparti (${secondes} s). Votre saisie est conservée, retentez dans un instant.` : "Le serveur n'a pas répondu, alors que cet appareil est bien connecté : la requête a été bloquée ou interrompue avant d'arriver. Votre saisie est conservée, elle sera renvoyée automatiquement.") + "\n\nDétail technique : " + technique), {
        explicite: true,
        technique
      });
    }
  }
  throw dernierEchec || new Error("Envoi impossible.");
}

// ---- File d'attente : aucune saisie perdue même sans réseau ----
const lireOutbox = () => loadU("outbox", []) || [];
const ecrireOutbox = l => saveU("outbox", l);
const outboxCount = () => lireOutbox().length;
function empilerOutbox(table, upserts, suppressions) {
  const l = lireOutbox();
  l.push({
    cle: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    table,
    upserts: upserts || [],
    suppressions: suppressions || [],
    essais: 0,
    le: new Date().toISOString()
  });
  ecrireOutbox(l);
}
let _envoiEnCours = false;
/** Vide la file d'attente. Renvoie {envoyes, restants, erreur}. */
// Envois définitivement refusés : mis de côté pour ne PAS bloquer les suivants.
const MAX_ESSAIS = 5;
const lireBloques = () => loadU("bloques", []) || [];
const ecrireBloques = l => saveU("bloques", l);
const bloquesCount = () => lireBloques().length;
/**
 * Remet les envois bloqués dans la file, pour un nouvel essai manuel.
 * @param {boolean} forcer  passe outre les refus « doublon » du serveur.
 */
function rejouerBloques(forcer) {
  const b = lireBloques();
  if (!b.length) return 0;
  const file = lireOutbox();
  b.forEach(op => {
    op.essais = 0;
    delete op.derniereErreur;
    if (forcer) {
      op.confirmerDoublon = true;
    }
    file.push(op);
  });
  ecrireOutbox(file);
  ecrireBloques([]);
  return b.length;
}

/** Raison du premier envoi bloqué, pour l'afficher à l'utilisateur. */
function raisonBlocage() {
  const b = lireBloques();
  return b.length ? b[0].derniereErreur || "Raison inconnue." : "";
}
/** Un blocage dû à une double déclaration peut être confirmé par l'utilisateur. */
function blocageConfirmable() {
  return lireBloques().some(o => /déjà été déclarées/i.test(o.derniereErreur || ""));
}
async function viderOutbox() {
  if (_envoiEnCours) return {
    envoyes: 0,
    restants: outboxCount(),
    bloques: bloquesCount()
  };
  if (MODE() !== "serveur" || !getJeton()) return {
    envoyes: 0,
    restants: outboxCount(),
    bloques: bloquesCount()
  };
  _envoiEnCours = true;
  let envoyes = 0,
    erreur = null,
    nouveauxBloques = 0;
  try {
    // ---- REGROUPEMENT ----
    // Plusieurs modifications d'affilée sur la même table (corriger deux
    // lignes, ajouter un intérimaire puis ses heures) partaient en autant
    // d'allers-retours. On les fusionne : un seul appel au lieu de N.
    let file = lireOutbox();
    if (file.length > 1) {
      const fusion = [];
      file.forEach(op => {
        const prec = fusion[fusion.length - 1];
        if (prec && prec.table === op.table && !prec.confirmerSuppressionMassive && !op.confirmerSuppressionMassive && (prec.essais || 0) === 0 && (op.essais || 0) === 0) {
          // Une ligne réécrite plus tard remplace la précédente
          const ids = new Set((op.upserts || []).map(u => u.id));
          prec.upserts = (prec.upserts || []).filter(u => !ids.has(u.id)).concat(op.upserts || []);
          prec.suppressions = (prec.suppressions || []).concat(op.suppressions || []);
        } else {
          fusion.push(op);
        }
      });
      if (fusion.length < file.length) {
        file = fusion;
        ecrireOutbox(file);
      }
    }
    let i = 0;
    // On parcourt TOUTE la file : un envoi qui échoue ne doit plus empêcher
    // les autres de partir (une saisie refusée bloquait tout, indéfiniment).
    while (i < file.length) {
      const op = file[i];
      try {
        await api("enregistrer", {
          jeton: getJeton(),
          table: op.table,
          upserts: op.upserts,
          suppressions: op.suppressions,
          confirmerDoublon: !!op.confirmerDoublon,
          confirmerSuppressionMassive: !!op.confirmerSuppressionMassive
        });
        file.splice(i, 1);
        ecrireOutbox(file);
        envoyes++;
      } catch (e) {
        op.essais = (op.essais || 0) + 1;
        op.derniereErreur = e.message;
        erreur = e;
        const definitif = !!e.codeErreur; // refus métier : inutile d'insister

        // Un lot regroupé qui se fait refuser : on le redécoupe ligne par ligne
        // pour n'écarter QUE la ligne fautive, sans pénaliser les bonnes.
        const groupe = (op.upserts || []).length + (op.suppressions || []).length > 1;
        if (definitif && groupe) {
          const morceaux = [];
          (op.upserts || []).forEach(u => morceaux.push({
            cle: op.cle + "-u" + u.id,
            table: op.table,
            upserts: [u],
            suppressions: [],
            essais: 0
          }));
          (op.suppressions || []).forEach(id => morceaux.push({
            cle: op.cle + "-s" + id,
            table: op.table,
            upserts: [],
            suppressions: [id],
            essais: 0
          }));
          file.splice(i, 1, ...morceaux);
          ecrireOutbox(file);
          continue; // on retente chaque ligne séparément
        }
        if (definitif || op.essais >= MAX_ESSAIS) {
          const b = lireBloques();
          b.push(op);
          ecrireBloques(b);
          file.splice(i, 1);
          ecrireOutbox(file);
          nouveauxBloques++;
        } else {
          file[i] = op;
          ecrireOutbox(file);
          i++; // on tente les suivants
        }
      }
    }
  } finally {
    _envoiEnCours = false;
  }
  return {
    envoyes,
    restants: outboxCount(),
    bloques: bloquesCount(),
    nouveauxBloques,
    erreur
  };
}

// Les colonnes de la base portent EXACTEMENT les mêmes noms que dans
// l'application. Il n'y a donc plus aucune traduction à faire : ce qui
// part du téléphone est ce qui arrive dans la base. C'était la source
// d'écritures perdues en silence la première fois.

/**
 * Sortie unique pour toute écriture, quel que soit le backend.
 * En mode serveur : la donnée est déjà enregistrée en local, on empile
 * l'opération puis on tente de l'envoyer. Si le réseau manque, elle
 * reste en file d'attente et repartira plus tard — rien n'est perdu.
 */
async function syncSortie(table, newData, prevData) {
  const prevIds = new Set((prevData || []).map(r => r.id));
  const newIds = new Set((newData || []).map(r => r.id));
  const upserts = (newData || []).filter(r => !prevIds.has(r.id) || JSON.stringify(r) !== JSON.stringify((prevData || []).find(p => p.id === r.id)));
  const suppressions = [...prevIds].filter(id => !newIds.has(id));
  if (!upserts.length && !suppressions.length) return {
    envoyes: 0,
    restants: outboxCount()
  };
  if (MODE() === "serveur") {
    empilerOutbox(table, upserts, suppressions);
    const r = await viderOutbox();
    if (r.erreur) throw r.erreur;
    return r;
  }
  // Mode local (aucun serveur configuré) : la donnée reste sur l'appareil.
  return {
    envoyes: 0,
    restants: 0
  };
}

  // En mode serveur, on n'affiche JAMAIS la liste figée dans le code : seul le

  // manœuvre voyait les 31 noms tant que la réponse du serveur n'arrivait pas.
  const [salaries, setSalariesRaw] = useState(() => {
    const s = loadU("salaries", null);
    if (s && s.length > 0) return s;
    // Aucun repli sur une liste écrite en dur : seul le serveur décide de ce

      return;

      setEditErr("Ce nom existe déjà.");
      return;
    }
    const c = String(editCode || "").trim();
    if (!new RegExp(`^\\d{${CODE_MIN},${CODE_MAX}}$`).test(c)) {

      return;
    }
    if (MODE() === "serveur") {
      try {
