<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ============================================================
//  CONSTANTES
// ============================================================
const AGENCES = [
  { id: "AG-01", nom: "ARPEL", couleur: "#1B4F72" },
  { id: "AG-02", nom: "DEFI",  couleur: "#B7410E" },
];
const POSTES = ["Chef d'équipe","Manœuvre"];
const COULEURS_CHANTIER = ["#F5C518","#E55934","#3D5A80","#2A9D8F","#9B5DE5","#E67E22"];
const TYPES_ABSENCE = [
  { code: "CP",  label: "Congés payés",        couleur: "#2A9D8F", icone: "🌴" },
  { code: "RTT", label: "RTT",                 couleur: "#3D5A80", icone: "📅" },
  { code: "MAL", label: "Maladie",             couleur: "#E55934", icone: "🏥" },
  { code: "ACC", label: "Accident du travail", couleur: "#C0392B", icone: "⚠️" },
  { code: "ABS", label: "Absence injustifiée", couleur: "#7F8C8D", icone: "❓" },
  { code: "FER", label: "Jour férié",          couleur: "#F5C518", icone: "🎉" },
  { code: "FOR", label: "Formation",           couleur: "#9B5DE5", icone: "📚" },
  { code: "AUT", label: "Autre absence",       couleur: "#95A5A6", icone: "📋" },
];

// ============================================================
//  UTILITAIRES
// ============================================================
const calcHeures = (p) => {
  const [h1,m1] = p.debut.split(":").map(Number);
  const [h2,m2] = p.fin.split(":").map(Number);
  let min = (h2*60+m2)-(h1*60+m1);
  if (min < 0) min += 1440; // passage minuit (ex: 20h→6h)
  min -= (p.pause||0);
  return Math.max(0, Math.round((min/60)*100)/100);
};
const calcHSupSemaine = (ptgs) => {
  const total = ptgs.reduce((s,p)=>s+calcHeures(p),0);
  return Math.max(0, Math.round((total-35)*100)/100);
};
const calcHNuit = (p) => {
  const [h1,m1] = p.debut.split(":").map(Number);
  const [h2,m2] = p.fin.split(":").map(Number);
  let debutMin = h1*60+m1;
  let finMin   = h2*60+m2;
  if (finMin <= debutMin) finMin += 1440; // passage minuit
  // Plages de nuit : 20h-24h (1200-1440) et 00h-06h (0-360 / 1440-1800 normalisé)
  const overlap = (s1,e1,s2,e2) => Math.max(0, Math.min(e1,e2)-Math.max(s1,s2));
  const minNuit = overlap(debutMin,finMin,1200,1440)
                + overlap(debutMin,finMin,0,360)
                + overlap(debutMin,finMin,1440,1800);
  return Math.min(Math.round((minNuit/60)*100)/100, calcHeures(p));
};
const fmtH = (n) => `${Math.floor(n)}h${String(Math.round((n%1)*60)).padStart(2,"0")}`;

// ============================================================
//  JOURS FÉRIÉS FRANÇAIS + MAJORATIONS 25 % / 50 % / 100 %
// ============================================================
// Dimanche de Pâques (algorithme de Meeus/Butcher)
function paques(annee){
  const a=annee%19, b=Math.floor(annee/100), c=annee%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30, i=Math.floor(c/4), k=c%4;
  const l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451);
  const mois=Math.floor((h+l-7*m+114)/31), jour=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(annee,mois-1,jour));
}
const _isoUTC = (d) => d.toISOString().slice(0,10);
const _plusJours = (d,n) => { const x=new Date(d.getTime()); x.setUTCDate(x.getUTCDate()+n); return x; };
const _cacheFeries = {};
function feriesAnnee(annee){
  if(_cacheFeries[annee]) return _cacheFeries[annee];
  const P=paques(annee);
  const liste={
    [`${annee}-01-01`]:"Jour de l'an",
    [`${annee}-05-01`]:"Fête du travail",
    [`${annee}-05-08`]:"Victoire 1945",
    [`${annee}-07-14`]:"Fête nationale",
    [`${annee}-08-15`]:"Assomption",
    [`${annee}-11-01`]:"Toussaint",
    [`${annee}-11-11`]:"Armistice",
    [`${annee}-12-25`]:"Noël",
    [_isoUTC(_plusJours(P,1))]:"Lundi de Pâques",
    [_isoUTC(_plusJours(P,39))]:"Ascension",
    [_isoUTC(_plusJours(P,50))]:"Lundi de Pentecôte",
  };
  _cacheFeries[annee]=liste;
  return liste;
}
const nomFerie = (iso) => feriesAnnee(Number(iso.slice(0,4)))[iso] || null;
const estFerie  = (iso) => !!nomFerie(iso);
const estDimanche = (iso) => new Date(iso+"T12:00:00Z").getUTCDay()===0;
const estMajore100 = (iso) => estDimanche(iso) || estFerie(iso);

// Répartit les heures NETTES d'un pointage sur les jours calendaires
// qu'il traverse (gère les postes à cheval sur minuit).
function heuresParJour(p){
  const [h1,m1]=p.debut.split(":").map(Number);
  const [h2,m2]=p.fin.split(":").map(Number);
  let d=h1*60+m1, f=h2*60+m2;
  if(f<=d) f+=1440;
  const parts=[];
  const finJ1=Math.min(f,1440);
  if(finJ1>d) parts.push({date:p.date, min:finJ1-d});
  if(f>1440)  parts.push({date:_isoUTC(_plusJours(new Date(p.date+"T12:00:00Z"),1)), min:f-1440});
  const brut=parts.reduce((s,x)=>s+x.min,0);
  const net=calcHeures(p); // heures nettes (pause déjà déduite)
  const res={};
  if(brut<=0||net<=0) return res;
  parts.forEach(x=>{ res[x.date]=(res[x.date]||0)+net*(x.min/brut); });
  return res;
}
// Heures d'un pointage tombant un dimanche ou un jour férié → majorées 100 %
function calcH100(p){
  let h=0;
  Object.entries(heuresParJour(p)).forEach(([iso,v])=>{ if(estMajore100(iso)) h+=v; });
  return Math.round(h*100)/100;
}
// Majorations sur une SEMAINE, pour une personne.
// Règle retenue : dimanche/férié = +100 % exclusif (ces heures ne sont pas
// recomptées dans les paliers 25 % / 50 %).
// Heures ordinaires : 35 h base, de la 36e à la 43e = +25 %, au-delà de 43 h = +50 %.
function calcMajorations(ptgs){
  let h100=0, hOrd=0;
  (ptgs||[]).forEach(p=>{ const t=calcHeures(p), d=calcH100(p); h100+=d; hOrd+=Math.max(0,t-d); });
  const r=(n)=>Math.round(n*100)/100;
  const hBase=r(Math.min(hOrd,35));
  const h25=r(Math.max(0,Math.min(hOrd-35,8)));
  const h50=r(Math.max(0,hOrd-43));
  return { hBase, h25, h50, h100:r(h100), hOrdinaire:r(hOrd), total:r(hOrd+h100), hSup:r(h25+h50) };
}
// Nuitées : nombre de journées avec déplacement + logement
const calcNuitees = (ptgs) => (ptgs||[]).filter(p=>p.deplacement).length;

// ============================================================
//  CODES D'ACCÈS PERSONNELS + SOLDE DE CONGÉS
// ============================================================
const CODE_DEFAUT = "0000";
const CONGES_DEFAUT = 25;               // jours ouvrés par an
const codeDe   = (p) => (p && p.code) ? String(p.code) : CODE_DEFAUT;
const congesDe = (p) => (p && p.conges != null && p.conges !== "") ? Number(p.conges) : CONGES_DEFAUT;

// Jours ouvrés (lun-ven, hors jours fériés) d'une absence, limités à une année.
function joursAbsenceAnnee(a, annee){
  if(!a || !a.dateDebut || !a.dateFin) return 0;
  let n=0;
  const d1=new Date(a.dateDebut+"T12:00:00Z"), d2=new Date(a.dateFin+"T12:00:00Z");
  for(let d=new Date(d1.getTime()); d<=d2; d.setUTCDate(d.getUTCDate()+1)){
    const iso=_isoUTC(d), jour=d.getUTCDay();
    if(annee!=null && Number(iso.slice(0,4))!==Number(annee)) continue;
    if(jour===0||jour===6) continue;      // week-end
    if(estFerie(iso)) continue;           // jour férié
    n++;
  }
  return n;
}
// Congés payés (type CP) déjà pris par une personne sur une année
const congesPris = (absences, personneId, annee) =>
  (absences||[]).filter(a=>a.salarie===personneId && a.type==="CP")
                .reduce((s,a)=>s+joursAbsenceAnnee(a,annee),0);
// Bilan congés : { droit, pris, restant }
function bilanConges(personne, absences, annee){
  const droit=congesDe(personne);
  const pris=congesPris(absences, personne?.id, annee);
  return { droit, pris, restant: Math.round((droit-pris)*10)/10 };
}
const initiales = (nom) => nom.trim().split(" ").map(n=>n[0]).join("").slice(0,2).toUpperCase();
const genId = (p) => `${p}-${Date.now().toString(36).toUpperCase()}${Math.random().toString(36).slice(2,5).toUpperCase()}`;
const dateFr = () => new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).toUpperCase();
const heureFr = () => new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});

// ============================================================
//  PASSERELLE PLANNING  →  RAPPORT HEURE
//  Lit le planning (Google Apps Script) et propose de créer
//  les pointages de la semaine. Rapprochement par nom.
// ============================================================

// URL de l'API Apps Script du planning (modifiable dans Paramètres)
const PLANNING_GAS_URL_DEFAUT = "https://script.google.com/macros/s/AKfycbyovrVtwNYaZhBnQewdHxfZhUSRvKEvWgOpmYTiZ2Sdx494FhusobScjWg-tdko93Nq/exec";
const getPlanningUrl = () => (typeof localStorage!=="undefined" && localStorage.getItem("chok_planning_url")) || PLANNING_GAS_URL_DEFAUT;

// Heures par défaut appliquées aux pointages importés (le chef confirmera)
const PLANNING_DEBUT_DEFAUT = "08:00";
const PLANNING_FIN_DEFAUT   = "16:00";
const PLANNING_PAUSE_DEFAUT = 60;

// Normalisation d'un nom : majuscules sans accents, ponctuation retirée
const normNom = (s) => (s||"")
  .toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
const tokensNom = (s) => normNom(s).split(" ").filter(t=>t.length>1);

// Rapproche un nom du planning avec la liste des salariés.
// Renvoie {id, score} du meilleur candidat, ou null.
function matchSalarie(nomPlanning, salaries) {
  const cible = normNom(nomPlanning);
  if (!cible) return null;
  const tCible = tokensNom(nomPlanning);
  let best = null;
  salaries.forEach(sal => {
    const nSal = normNom(sal.nom);
    const tSal = tokensNom(sal.nom);
    let score = 0;
    if (nSal === cible) score = 100;
    else {
      // tous les tokens du nom le plus court présents dans l'autre
      const court = tCible.length <= tSal.length ? tCible : tSal;
      const long  = tCible.length <= tSal.length ? tSal : tCible;
      const tousPresents = court.length>0 && court.every(t => long.includes(t));
      const communs = tCible.filter(t => tSal.includes(t)).length;
      if (tousPresents) score = 60 + communs*10;
      else if (communs>0) score = communs*10;
    }
    if (score>0 && (!best || score>best.score)) best = {id:sal.id, score, nom:sal.nom};
  });
  return best && best.score>=20 ? best : null;
}

// Rapproche un nom de chantier (texte libre) avec la liste des chantiers
function matchChantier(noteChantier, chantiers) {
  const cible = normNom(noteChantier);
  if (!cible) return null;
  let best = null;
  chantiers.forEach(ch => {
    const nCh = normNom(ch.nom);
    let score = 0;
    if (nCh === cible) score = 100;
    else if (nCh && (nCh.includes(cible) || cible.includes(nCh))) score = 70;
    else {
      const tC = tokensNom(noteChantier), tH = tokensNom(ch.nom);
      const communs = tC.filter(t=>tH.includes(t)).length;
      if (communs>0) score = communs*15;
    }
    if (score>0 && (!best || score>best.score)) best = {id:ch.id, score, nom:ch.nom};
  });
  return best && best.score>=30 ? best : null;
}

// ---- Dates : reconstruire la date depuis la clé de cellule du planning ----
// Clé planning : w{AAAASS}_d{0-5}_c{idChef}   (jour 0=lundi … 5=samedi)
function planningAbsWkToMonday(idx) {
  const y = parseInt(String(idx).slice(0,4),10), w = parseInt(String(idx).slice(4),10);
  const j4 = new Date(y,0,4), s = new Date(j4);
  s.setDate(j4.getDate() - (j4.getDay()||7) + 1);
  const r = new Date(s); r.setDate(s.getDate() + (w-1)*7); return r;
}
const planningWeekNum = (d) => {
  const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  return Math.ceil(((t-new Date(Date.UTC(t.getUTCFullYear(),0,1)))/86400000+1)/7);
};
const planningAbsWk = (d) => `${d.getFullYear()}${String(planningWeekNum(d)).padStart(2,"0")}`;
const isoLocal = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
// Lundi d'une semaine décalée de "off" semaines par rapport à aujourd'hui
function planningMonday(off=0) {
  const n=new Date(), day=n.getDay(), diff=day===0?-6:1-day;
  n.setHours(0,0,0,0); n.setDate(n.getDate()+diff+off*7); return n;
}

// Charge le planning via JSONP (contourne CORS sur Apps Script)
function chargerPlanning() {
  return new Promise((resolve, reject) => {
    const url = getPlanningUrl();
    if (!url) { reject(new Error("URL du planning non configurée")); return; }
    const cb = "chokPlanningCb_" + Date.now().toString(36) + Math.floor(Math.random()*1e6);
    const script = document.createElement("script");
    const minuteur = setTimeout(() => { nettoyer(); reject(new Error("Délai dépassé — vérifiez l'URL du planning")); }, 15000);
    function nettoyer(){ clearTimeout(minuteur); delete window[cb]; if(script.parentNode) script.parentNode.removeChild(script); }
    window[cb] = (data) => { nettoyer(); resolve(data); };
    script.onerror = () => { nettoyer(); reject(new Error("Connexion impossible au planning")); };
    script.src = url + (url.includes("?")?"&":"?") + "action=load&callback=" + cb;
    document.body.appendChild(script);
  });
}

// Transforme les cellules CHANTIER du planning d'une semaine en lignes d'import
function planningVersLignes(data, lundi, salaries, chantiers, pointagesExistants) {
  const cells = (data && data.cells) || {};
  const semaineWk = planningAbsWk(lundi);
  const chefsParId = {};
  (data.chefs||[]).forEach(c => { if(c.id) chefsParId[c.id] = c.name; });
  const lignes = [];
  Object.keys(cells).forEach(key => {
    const m = String(key).match(/^w([^_]+)_d(\d+)_c(.+)$/);
    if (!m) return;
    if (m[1] !== semaineWk) return;            // semaine demandée uniquement
    const cell = cells[key];
    if (!cell || cell.type !== "CHANTIER") return;  // on ignore absences/congés ici
    const jour = parseInt(m[2],10);
    if (jour > 5) return;                       // dimanche ignoré
    const date = new Date(lundi); date.setDate(lundi.getDate()+jour);
    const dateIso = isoLocal(date);
    const nomChef = chefsParId[m[3]] || cell.directorId || m[3];
    const sal = matchSalarie(nomChef, salaries);
    const noteCh = cell.note || "";
    const ch = noteCh ? matchChantier(noteCh, chantiers) : null;
    const doublon = !!sal && pointagesExistants.some(p => p.salarie===sal.id && p.date===dateIso);
    lignes.push({
      key, dateIso, jour,
      nomChef, noteChantier: noteCh,
      manoeuvre: cell.manoeuvre || "",
      activite: cell.activite || "",
      salarieId: sal ? sal.id : "",
      chantierId: ch ? ch.id : "",
      inclure: !!sal && !doublon,           // pré-coché si rapproché et non doublon
      doublon,
    });
  });
  // tri par date puis chef
  lignes.sort((a,b)=> a.dateIso.localeCompare(b.dateIso) || a.nomChef.localeCompare(b.nomChef));
  return lignes;
}

// ============================================================
//  COULEURS & TYPO
// ============================================================
const C = {
  fond:"#F2EFE9", encre:"#0A0A0A", jaune:"#F5C518", orange:"#E55934",
  vert:"#2A9D8F", gris:"#8A857A", ligne:"#D8D2C3", papier:"#FBFAF6", bleu:"#1B4F72",
};
const FT = "'Bricolage Grotesque', system-ui, sans-serif";
const FM = "'JetBrains Mono', ui-monospace, monospace";

// ============================================================
//  PERSISTANCE localStorage
// ============================================================
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function usePersist(key, init) {
  const [val, setVal] = useState(() => load(key, init));
  const setter = (v) => {
    const next = typeof v === "function" ? v(val) : v;
    setVal(next); save(key, next);
  };
  return [val, setter];
}

// ============================================================
//  UTILITAIRES SEMAINE ISO
// ============================================================
function infoSemaine(iso) {
  const d = new Date(iso + "T00:00:00");
  const j = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = j.getUTCDay() || 7;
  j.setUTCDate(j.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(j.getUTCFullYear(), 0, 1));
  const numSem = Math.ceil((((j - yearStart) / 86400000) + 1) / 7);
  const annee = j.getUTCFullYear();
  const sem = String(numSem).padStart(2, "0");
  const lundiD = new Date(iso + "T00:00:00");
  lundiD.setDate(lundiD.getDate() - (lundiD.getDay() || 7) + 1);
  const vendrediD = new Date(lundiD); vendrediD.setDate(lundiD.getDate() + 4);
  const fmt = (x) => x.toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
  return {
    annee, semaine: numSem, cle: `${annee}-S${sem}`,
    label: `S${sem} — ${fmt(lundiD)} au ${fmt(vendrediD)} ${annee}`,
    labelCourt: `S${sem}`,
    moisNum: lundiD.getMonth() + 1,
    moisLabel: lundiD.toLocaleDateString("fr-FR", {month:"long", year:"numeric"}),
    lundi: lundiD.toISOString().slice(0,10),
    vendredi: vendrediD.toISOString().slice(0,10),
  };
}
function semaineCouranteCle() { return infoSemaine(new Date().toISOString().slice(0,10)).cle; }
function grouperParSemaine(pointages) {
  const map = {};
  pointages.forEach(p => { const { cle } = infoSemaine(p.date); if (!map[cle]) map[cle] = []; map[cle].push(p); });
  return map;
}

/** Appel au serveur Google. Renvoie l'objet JSON ou lève une erreur lisible. */
async function api(action, params) {
  const url = getApiUrl();
  if (!url) throw new Error("Adresse du serveur Google non renseignée (Paramètres).");
  let rep;
  try {
    rep = await fetch(url, {
      method: "POST",
      // text/plain : évite le pré-vol CORS, qu'Apps Script ne gère pas.
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      redirect: "follow",
      body: JSON.stringify(Object.assign({ action }, params || {})),
    });
  } catch (e) {
    throw new Error("Connexion au serveur impossible (réseau ou adresse incorrecte).");
  }
  if (!rep.ok) throw new Error(`Serveur Google : erreur ${rep.status}.`);
  const texte = await rep.text();
  let data;
  try { data = JSON.parse(texte); }
  catch (e) {
    throw new Error("Réponse inattendue du serveur. Vérifiez que le déploiement est accessible à « Tout le monde ».");
  }
  if (!data.ok) {
    const err = new Error(data.erreur || "Erreur inconnue du serveur.");
    err.codeErreur = data.codeErreur; err.expire = data.expire;
    throw err;
  }
  return data;
}

// ---- File d'attente : aucune saisie perdue même sans réseau ----
const OUTBOX_CLE = "chok_outbox";
const lireOutbox  = () => { try { return JSON.parse(localStorage.getItem(OUTBOX_CLE) || "[]"); } catch(e){ return []; } };
const ecrireOutbox= (l) => { try { localStorage.setItem(OUTBOX_CLE, JSON.stringify(l)); } catch(e){} };
const outboxCount = () => lireOutbox().length;

function empilerOutbox(table, upserts, suppressions) {
  const l = lireOutbox();
  l.push({ cle: `${Date.now()}-${Math.random().toString(36).slice(2,7)}`, table,
           upserts: upserts||[], suppressions: suppressions||[], essais: 0, le: new Date().toISOString() });
  ecrireOutbox(l);
}

let _envoiEnCours = false;
/** Vide la file d'attente. Renvoie {envoyes, restants, erreur}. */
async function viderOutbox() {
  if (_envoiEnCours) return { envoyes: 0, restants: outboxCount() };
  if (MODE() !== "google" || !getJeton()) return { envoyes: 0, restants: outboxCount() };
  _envoiEnCours = true;
  let envoyes = 0, erreur = null;
  try {
    let file = lireOutbox();
    while (file.length) {
      const op = file[0];
      try {
        await api("enregistrer", { jeton: getJeton(), table: op.table,
                                   upserts: op.upserts, suppressions: op.suppressions,
                                   confirmerSuppressionMassive: !!op.confirmerSuppressionMassive });
        file.shift(); ecrireOutbox(file); envoyes++;
      } catch (e) {
        // On conserve l'opération pour un nouvel essai plus tard.
        op.essais = (op.essais||0) + 1; op.derniereErreur = e.message;
        file[0] = op; ecrireOutbox(file);
        erreur = e; break;
      }
    }
  } finally { _envoiEnCours = false; }
  return { envoyes, restants: outboxCount(), erreur };
}

};
const _DB2JS = Object.fromEntries(Object.entries(_JS2DB).map(([k,v])=>[v,k]));
const versDB = (o) => { const r={}; Object.entries(o||{}).forEach(([k,v])=>{ r[_JS2DB[k]||k]=v; }); return r; };
const versJS = (o) => { const r={}; Object.entries(o||{}).forEach(([k,v])=>{ r[_DB2JS[k]||k]=v; }); return r; };
const listeVersJS = (arr) => (arr||[]).map(versJS);

async function sbSync(table, newData, prevData) {
  const sb = getSb(); if (!sb) return;
  const prevIds = new Set((prevData||[]).map(r=>r.id));
  const newIds  = new Set((newData||[]).map(r=>r.id));
  const toUpsert  = newData.filter(r => !prevIds.has(r.id) || JSON.stringify(r) !== JSON.stringify((prevData||[]).find(p=>p.id===r.id)));
  const toDelete  = [...prevIds].filter(id => !newIds.has(id));
  if (toUpsert.length) {
    const { error } = await sb.from(table).upsert(toUpsert.map(versDB));
    if (error) throw new Error(`${table} : ${error.message}`);
  }
  if (toDelete.length) {
    const { error } = await sb.from(table).delete().in("id", toDelete);
    if (error) throw new Error(`${table} : ${error.message}`);
  }
}

/**
 * Sortie unique pour toute écriture, quel que soit le backend.
 * En mode Google : la donnée est déjà enregistrée en local, on empile
 * l'opération puis on tente de l'envoyer. Si le réseau manque, elle
 * reste en file d'attente et repartira plus tard — rien n'est perdu.
 */
async function syncSortie(table, newData, prevData) {
  const prevIds = new Set((prevData||[]).map(r=>r.id));
  const newIds  = new Set((newData||[]).map(r=>r.id));
  const upserts = (newData||[]).filter(r => !prevIds.has(r.id) ||
      JSON.stringify(r) !== JSON.stringify((prevData||[]).find(p=>p.id===r.id)));
  const suppressions = [...prevIds].filter(id => !newIds.has(id));
  if (!upserts.length && !suppressions.length) return { envoyes:0, restants:outboxCount() };

  if (MODE() === "google") {
    empilerOutbox(table, upserts, suppressions);
    const r = await viderOutbox();
    if (r.erreur) throw r.erreur;
    return r;
  }
  await sbSync(table, newData, prevData);
  return { envoyes: 1, restants: 0 };
}

    interimaires: useRef(interimaires),
    chantiers:    useRef(chantiers),
    pointages:    useRef(pointages),
    absences:     useRef(absences),

  useEffect(() => { refs.chantiers.current    = chantiers; },    [chantiers]);
  useEffect(() => { refs.pointages.current    = pointages; },    [pointages]);
  useEffect(() => { refs.absences.current     = absences; },     [absences]);

  const chargerDepuisSupabase = useCallback(async () => {
    const sb = getSb(); if (!sb) return;
    setAppLoading(true); setSyncState("syncing");
    try {
      const [s,i,c,p,a] = await Promise.all([
        sb.from("salaries").select("*"),
        sb.from("interimaires").select("*"),
        sb.from("chantiers").select("*"),
        sb.from("pointages").select("*"),
        sb.from("absences").select("*"),
      ]);
      if (!s.error && s.data.length) {
        // Supprimer les salariés retirés de la liste officielle
        const SUPPRIMES = ["S-007"];
        await Promise.all(SUPPRIMES.map(id => sb.from("salaries").delete().eq("id", id)));

    if (MODE() !== "google" || !getJeton()) return;
    setAppLoading(true); setSyncState("syncing");
    try {
      // On envoie d'abord ce qui attend, pour ne pas écraser des saisies locales.
      await viderOutbox();
      const rep = await api("charger", { jeton: getJeton() });
      const d = rep.donnees || {};
      const pose = (arr, setter, cle) => { const v = arr || []; setter(v); save(cle, v); };

      pose(d.absences,     setAbsencesRaw,     "chok_absences");

      setSyncState("err");
      if (e && e.expire) { setJeton(null); setSession(null); }
    }
    finally { setAppLoading(false); }

      const r = await viderOutbox();

    window.addEventListener("online", relancer);

      const prev = ref.current;
      const next = typeof v === "function" ? v(prev) : v;
      ref.current = next;
      rawSetter(next);
      save(lsKey, next);   // 1) toujours enregistré en local d'abord

  const donnees = { salaries, setSalaries, interimaires, setInterimaires, chantiers, setChantiers, pointages, setPointages, absences, setAbsences };

  );

function EcranConnexion({salaries, interimaires, pinRH, pinChef, onConnexion}) {
  const [mode, setMode]       = useState(null);
  const [pin, setPin]         = useState("");
  const [personneId, setPersonneId] = useState("");
  const [erreur, setErreur]   = useState("");

  const toutesPersonnes = [
    ...salaries.map(s=>({...s,_type:"interne"})),
    ...interimaires.filter(i=>i.accesPlateforme).map(i=>({...i,_type:"interim"})),
  ];

  const [enCours, setEnCours] = useState(false);
  const [etapeSal, setEtapeSal] = useState("nom");
  // Liste des noms : depuis le serveur Google (appareil neuf), sinon cache local.
  const [personnesServeur, setPersonnesServeur] = useState(null);
  useEffect(() => {
    if (MODE() !== "google") return;
    api("listePersonnes", {})
      .then(r => setPersonnesServeur(r.personnes || []))
      .catch(() => setPersonnesServeur(null));
  }, []);
  const salariesListe = personnesServeur
    ? personnesServeur.filter(p=>p.type==="interne")
    : salaries;
  const interimListe = personnesServeur
    ? personnesServeur.filter(p=>p.type==="interim")
    : interimaires.filter(i=>i.accesPlateforme);

  /** Connexion RH / chef. En mode Google, le code est vérifié par le serveur. */
  const validerPin = async (attendu, role) => {
    if (MODE() === "google") {
      setEnCours(true); setErreur("");
      try {
        const r = await api("connexion", { role, pin });
        setJeton(r.jeton);
        onConnexion({ role });
      } catch (e) { setErreur(e.message); setPin(""); }
      finally { setEnCours(false); }
      return;
    }
    if (pin === attendu) { onConnexion({ role }); }
    else { setErreur("Code incorrect. Réessayez."); setPin(""); }
  };

  const personneSel = personnesServeur
    ? personnesServeur.find(x=>x.id===personneId)
    : [...salaries, ...interimaires].find(x=>x.id===personneId);

  const validerSalarie = () => {
    if (!personneId) { setErreur("Sélectionnez votre nom."); return; }
    setErreur(""); setPin(""); setEtapeSal("code");
  };

  const validerCodeSalarie = async () => {
    if (MODE() === "google") {
      setEnCours(true); setErreur("");
      try {
        const r = await api("connexion", { role: "salarie", personneId, pin });
        setJeton(r.jeton);
        onConnexion({ role: "salarie", personneId });
      } catch (e) { setErreur(e.message); setPin(""); }
      finally { setEnCours(false); }
      return;
    }
    if (pin === codeDe(personneSel)) { onConnexion({ role: "salarie", personneId }); }
    else { setErreur("Code incorrect. Demandez-le à la RH."); setPin(""); }
  };

  const reset = () => { setMode(null); setPin(""); setPersonneId(""); setErreur(""); setEtapeSal("nom"); };

  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:48}}>
        <div style={{width:56,height:56,background:C.encre,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="30" height="30" viewBox="0 0 22 22" fill="none">
            <path d="M2 18 L11 4 L20 18 Z" stroke="#0A0A0A" strokeWidth="2" fill="#F5C518"/>
            <circle cx="11" cy="14" r="1.5" fill="#0A0A0A"/>
          </svg>
        </div>
        <div>
          <div style={{fontFamily:FT,fontWeight:800,fontSize:28,letterSpacing:"-0.02em",lineHeight:1}}>RAPPORT HEURE</div>
          <div style={{fontFamily:FM,fontSize:12,color:C.gris,letterSpacing:"0.2em",marginTop:4}}>CHOK BÉTON</div>
        </div>
      </div>

      {enCours && <div style={{marginBottom:16,padding:"10px 16px",background:C.jaune,border:`1.5px solid ${C.encre}`,fontFamily:FM,fontSize:11,fontWeight:700,letterSpacing:"0.1em"}}>VÉRIFICATION DU CODE…</div>}

      {!mode && (
        <div style={{width:"100%",maxWidth:420}}>
          <div style={{fontFamily:FM,fontSize:11,color:C.gris,letterSpacing:"0.2em",textAlign:"center",marginBottom:20}}>QUI ÊTES-VOUS ?</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            <button onClick={()=>setMode("rh")} style={{padding:"20px 24px",background:C.encre,border:"none",color:C.papier,fontFamily:FM,fontSize:13,fontWeight:700,letterSpacing:"0.1em",cursor:"pointer",display:"flex",alignItems:"center",gap:16,textAlign:"left"}}>
              <span style={{fontSize:28}}>🏢</span>
              <div><div>RH / ADMIN</div><div style={{fontSize:10,fontWeight:400,color:C.gris,marginTop:3}}>Accès complet — lecture et modification</div></div>
            </button>
            <button onClick={()=>setMode("chef")} style={{padding:"20px 24px",background:C.jaune,border:`2px solid ${C.encre}`,color:C.encre,fontFamily:FM,fontSize:13,fontWeight:700,letterSpacing:"0.1em",cursor:"pointer",display:"flex",alignItems:"center",gap:16,textAlign:"left"}}>
              <span style={{fontSize:28}}>👷</span>
              <div><div>CHEF D'ÉQUIPE</div><div style={{fontSize:10,fontWeight:400,color:"#555",marginTop:3}}>Saisie des rapports d'heures</div></div>
            </button>
            <button onClick={()=>setMode("salarie")} style={{padding:"20px 24px",background:C.papier,border:`2px solid ${C.encre}`,color:C.encre,fontFamily:FM,fontSize:13,fontWeight:700,letterSpacing:"0.1em",cursor:"pointer",display:"flex",alignItems:"center",gap:16,textAlign:"left"}}>
              <span style={{fontSize:28}}>👤</span>
              <div><div>SALARIÉ</div><div style={{fontSize:10,fontWeight:400,color:C.gris,marginTop:3}}>Consulter mes propres heures</div></div>
            </button>
          </div>
        </div>
      )}

      {mode === "rh" && (
        <div style={{width:"100%",maxWidth:360}}>
          <div style={{fontFamily:FM,fontSize:11,color:C.gris,letterSpacing:"0.2em",textAlign:"center",marginBottom:20}}>CODE RH / ADMIN</div>
          <PinPad pin={pin} setPin={setPin} onValider={()=>validerPin(pinRH,"rh")} erreur={erreur} setErreur={setErreur}/>
          <button onClick={reset} style={{width:"100%",marginTop:12,padding:"12px",background:"transparent",border:`1px solid ${C.ligne}`,fontFamily:FM,fontSize:11,color:C.gris,cursor:"pointer"}}>← Retour</button>
        </div>
      )}

      {mode === "chef" && (
        <div style={{width:"100%",maxWidth:360}}>
          <div style={{fontFamily:FM,fontSize:11,color:C.gris,letterSpacing:"0.2em",textAlign:"center",marginBottom:20}}>CODE CHEF D'ÉQUIPE</div>
          <PinPad pin={pin} setPin={setPin} onValider={()=>validerPin(pinChef,"chef")} erreur={erreur} setErreur={setErreur}/>
          <button onClick={reset} style={{width:"100%",marginTop:12,padding:"12px",background:"transparent",border:`1px solid ${C.ligne}`,fontFamily:FM,fontSize:11,color:C.gris,cursor:"pointer"}}>← Retour</button>
        </div>
      )}

      {mode === "salarie" && etapeSal === "code" && (
        <div style={{width:"100%",maxWidth:360}}>
          <div style={{fontFamily:FM,fontSize:11,color:C.gris,letterSpacing:"0.2em",textAlign:"center",marginBottom:6}}>MON CODE PERSONNEL</div>
          <div style={{fontFamily:FT,fontSize:20,fontWeight:800,textAlign:"center",marginBottom:16}}>{personneSel?.nom||""}</div>
          <PinPad pin={pin} setPin={setPin} onValider={validerCodeSalarie} erreur={erreur} setErreur={setErreur}/>
          <button onClick={()=>{setEtapeSal("nom");setPin("");setErreur("");}} style={{width:"100%",marginTop:12,padding:"12px",background:"transparent",border:`1px solid ${C.ligne}`,fontFamily:FM,fontSize:11,color:C.gris,cursor:"pointer"}}>← Changer de nom</button>
        </div>
      )}

      {mode === "salarie" && etapeSal === "nom" && (
        <div style={{width:"100%",maxWidth:360}}>
          <div style={{fontFamily:FM,fontSize:11,color:C.gris,letterSpacing:"0.2em",textAlign:"center",marginBottom:20}}>MON NOM</div>
          {(salariesListe.length + interimListe.length) === 0
            ? <div style={{padding:"20px",background:"#FFF8E1",border:`1px solid ${C.ligne}`,fontSize:12,textAlign:"center",lineHeight:1.6}}>Aucun salarié enregistré.<br/>Demandez à la RH d'ajouter votre nom.</div>
            : <>
                <select value={personneId} onChange={e=>{setPersonneId(e.target.value);setErreur("");}}
                  style={{width:"100%",padding:"16px",background:C.papier,border:`2px solid ${C.encre}`,fontFamily:FM,fontSize:14,outline:"none",marginBottom:12}}>
                  <option value="" disabled>— Sélectionnez votre nom —</option>
                  {salariesListe.length>0 && <optgroup label="── Salariés CHOK BÉTON">{salariesListe.map(s=><option key={s.id} value={s.id}>{s.nom}</option>)}</optgroup>}
                  {interimListe.length>0 && <optgroup label="── Intérimaires">{interimListe.map(i=>{const ag=AGENCES.find(a=>a.id===i.agence);return <option key={i.id} value={i.id}>{i.nom}{ag?` (${ag.nom})`:""}</option>;})}</optgroup>}
                </select>
                {erreur && <div style={{padding:"8px 12px",background:"#FFF0F0",border:`1px solid ${C.orange}`,color:C.orange,fontSize:12,marginBottom:12}}>{erreur}</div>}
                <button onClick={validerSalarie} style={{width:"100%",padding:"16px",background:C.encre,border:"none",color:C.jaune,fontFamily:FM,fontSize:13,fontWeight:700,letterSpacing:"0.1em",cursor:"pointer"}}>
                  CONTINUER →
                </button>
                <div style={{fontSize:10,color:C.gris,textAlign:"center",marginTop:10,lineHeight:1.5}}>Un code personnel à 4 chiffres vous sera demandé.<br/>Il est fourni par la RH.</div>
              </>
          }
          <button onClick={reset} style={{width:"100%",marginTop:12,padding:"12px",background:"transparent",border:`1px solid ${C.ligne}`,fontFamily:FM,fontSize:11,color:C.gris,cursor:"pointer"}}>← Retour</button>
        </div>
      )}
    </div>
  );
}

// ============================================================
//  CLAVIER PIN
// ============================================================
function PinPad({pin, setPin, onValider, erreur, setErreur}) {
  const ajouter = (c) => { if (pin.length >= 6) return; setErreur(""); setPin(pin + c); };
  const effacer = () => { setPin(pin.slice(0,-1)); setErreur(""); };
  return (
    <div>
      <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:20}}>
        {[0,1,2,3,4,5].map(i=>(
          <div key={i} style={{width:40,height:40,border:`2px solid ${pin.length>i?C.encre:C.ligne}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,fontWeight:700,background:pin.length>i?C.encre:C.papier,color:C.jaune}}>
            {pin.length>i?"●":""}
          </div>
        ))}
      </div>
      {erreur && <div style={{padding:"8px 12px",background:"#FFF0F0",border:`1px solid ${C.orange}`,color:C.orange,fontSize:12,marginBottom:12,textAlign:"center"}}>{erreur}</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:8}}>
        {["1","2","3","4","5","6","7","8","9"].map(c=>(
          <button key={c} onClick={()=>ajouter(c)} style={{padding:"18px",fontFamily:FT,fontSize:22,fontWeight:700,background:C.papier,border:`1.5px solid ${C.ligne}`,cursor:"pointer"}}>{c}</button>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
        <button onClick={effacer} style={{padding:"18px",fontFamily:FM,fontSize:12,fontWeight:700,background:"transparent",border:`1.5px solid ${C.ligne}`,cursor:"pointer",color:C.gris}}>⌫</button>
        <button onClick={()=>ajouter("0")} style={{padding:"18px",fontFamily:FT,fontSize:22,fontWeight:700,background:C.papier,border:`1.5px solid ${C.ligne}`,cursor:"pointer"}}>0</button>
        <button onClick={onValider} style={{padding:"18px",fontFamily:FM,fontSize:12,fontWeight:700,background:C.encre,border:"none",color:C.jaune,cursor:"pointer"}}>OK ✓</button>
      </div>
    </div>
  );
}

  const [heure, setHeure] = useState(heureFr());
  useEffect(() => { const t = setInterval(()=>setHeure(heureFr()),30000); return()=>clearInterval(t); },[]);
  const roleLabel = {rh:"RH / ADMIN", chef:"CHEF D'ÉQUIPE", salarie:"MON ESPACE"}[session.role];
  const roleColor = {rh:C.vert, chef:C.jaune, salarie:C.bleu}[session.role] || C.vert;
  const enAttente = outboxCount();
  const syncIcon = {idle:"", syncing:"⟳", ok:"☁", err:"⚠", attente:"⏳"}[syncState] || "";
  const syncColor = {idle:C.gris, syncing:C.bleu, ok:C.vert, err:C.orange, attente:"#B7770D"}[syncState] || C.gris;

    ? `${enAttente} en attente d'envoi`

        <div style={{width:40,height:40,background:C.encre,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M2 18 L11 4 L20 18 Z" stroke="#0A0A0A" strokeWidth="2" fill="#F5C518"/>
            <circle cx="11" cy="14" r="1.5" fill="#0A0A0A"/>
          </svg>
        </div>
        <div>
          <div style={{fontFamily:FT,fontWeight:800,fontSize:16,letterSpacing:"0.02em",lineHeight:1}}>RAPPORT HEURE</div>
          <div style={{fontFamily:FM,fontSize:10,color:C.gris,letterSpacing:"0.15em",marginTop:3}}>CHOK BÉTON</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 16px",background:C.fond,border:`1.5px solid ${C.encre}`}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:roleColor,boxShadow:`0 0 0 3px ${roleColor}44`}}/>
        <span style={{fontFamily:FM,fontSize:11,fontWeight:700,letterSpacing:"0.1em"}}>{roleLabel}</span>

      <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
        {(syncState!=="idle"||enAttente>0) && <span style={{display:"inline-flex",alignItems:"center",gap:5,fontFamily:FM,fontSize:11,fontWeight:700,color:syncColor,cursor:"pointer",padding:enAttente?"3px 8px":0,background:enAttente?"#FFF8E1":"transparent",border:enAttente?`1px solid #B7770D`:"none"}} title={syncTexte+" — cliquer pour réessayer"} onClick={onReload}>{syncIcon}{enAttente>0&&<span>{enAttente}</span>}</span>}
