//  VUE ADMIN
// ============================================================
function VueAdmin({pointages,setPointages,chantiers,setChantiers,salaries,setSalaries,interimaires,setInterimaires,absences,setAbsences,pinRH,setPinRH,pinChef,setPinChef,onChargerDemo,onReloadSupabase}) {
  const [onglet, setOnglet] = useState("pointages");
  const auj = new Date().toISOString().slice(0,10);
  const ptgAuj = pointages.filter(p=>p.date===auj);
  const totalH = ptgAuj.reduce((s,p)=>s+calcHeures(p),0);
  const aValider = ptgAuj.filter(p=>!p.valide).length;
  const semaineCourante = (()=>{const d=new Date(),day=d.getDay()||7;const lundi=new Date(d);lundi.setDate(d.getDate()-day+1);return Array.from({length:7},(_,i)=>{const x=new Date(lundi);x.setDate(lundi.getDate()+i);return x.toISOString().slice(0,10);});})();
  const ptgSemaine = pointages.filter(p=>semaineCourante.includes(p.date));
  const intJour = [...new Set(ptgAuj.filter(p=>p.interim).map(p=>p.salarie))].length;
  const intSemaine = [...new Set(ptgSemaine.filter(p=>p.interim).map(p=>p.salarie))].length;
  const trouver = (id) => salaries.find(s=>s.id===id) || interimaires.find(i=>i.id===id);
  const valider = (id) => setPointages(pointages.map(p=>p.id===id?{...p,valide:true}:p));
  const validerTout = () => setPointages(pointages.map(p=>p.date===auj?{...p,valide:true}:p));
  const supprPointage = (id) => setPointages(pointages.filter(p=>p.id!==id));
  const tabs = [["pointages","Pointages"],["absences","Absences"],["salaries","Salariés"],["interim","Intérimaires"],["chantiers","Chantiers"],["paie","Rapport"],["archives","Archives 📁"],["parametres","⚙ Paramètres"]];
  return (
    <main style={{padding:"28px 32px",maxWidth:1500,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",paddingBottom:20,borderBottom:`1px solid ${C.ligne}`,marginBottom:24}}>
        <div>
          <div style={{fontSize:11,color:C.gris,letterSpacing:"0.2em",marginBottom:6}}>JOURNÉE EN COURS</div>
          <div style={{fontFamily:FT,fontSize:32,fontWeight:800,letterSpacing:"-0.02em"}}>{dateFr()}</div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:14,marginBottom:28}}>
        <Kpi label="Pointages du jour" val={ptgAuj.length} sub="entrées aujourd'hui" accent={C.jaune}/>
        <Kpi label="Heures totales" val={fmtH(totalH)} sub={`${chantiers.filter(c=>c.actif).length} chantier(s) actif(s)`} accent="#3D5A80"/>
        <Kpi label="Salariés" val={salaries.length} sub="CHOK BÉTON enregistrés" accent={C.vert}/>
        <Kpi label="Intérimaires / jour" val={intJour} sub="personnes différentes aujourd'hui" accent={C.bleu}/>
        <Kpi label="Intérimaires / sem." val={intSemaine} sub="personnes cette semaine" accent="#6C3483"/>
        <Kpi label="À valider" val={aValider} sub="pointages en attente RH" accent={C.encre} alert={aValider>0}/>
      </div>
      <div className="admin-tabs">
        {tabs.map(([k,l])=>(
          <button key={k} onClick={()=>setOnglet(k)} style={{fontFamily:FM,fontSize:12,fontWeight:onglet===k?700:500,padding:"12px 20px",background:"transparent",border:"none",cursor:"pointer",letterSpacing:"0.1em",color:onglet===k?C.encre:C.gris,borderBottom:onglet===k?`3px solid ${C.jaune}`:"3px solid transparent",marginBottom:-2,flexShrink:0}}>
            {l.toUpperCase()}
          </button>
        ))}
      </div>
      {onglet==="pointages"  && <OngletPointages auj={auj} pointagesTous={pointages} setPointages={setPointages} chantiers={chantiers} setChantiers={setChantiers} salaries={salaries} interimaires={interimaires} trouver={trouver} aValider={aValider} valider={valider} validerTout={validerTout} supprPointage={supprPointage}/>}
      {onglet==="absences"   && <OngletAbsences absences={absences} setAbsences={setAbsences} salaries={salaries} interimaires={interimaires} pointages={pointages}/>}
      {onglet==="salaries"   && <OngletSalaries salaries={salaries} setSalaries={setSalaries} pointages={pointages} absences={absences}/>}
      {onglet==="interim"    && <OngletInterim interimaires={interimaires} setInterimaires={setInterimaires} pointages={pointages} chantiers={chantiers}/>}
      {onglet==="chantiers"  && <OngletChantiers chantiers={chantiers} setChantiers={setChantiers} pointages={pointages}/>}
      {onglet==="paie"       && <OngletPaie pointages={pointages} absences={absences} salaries={salaries} interimaires={interimaires} chantiers={chantiers}/>}
      {onglet==="archives"   && <OngletArchives pointages={pointages} absences={absences} salaries={salaries} interimaires={interimaires} chantiers={chantiers}/>}
      {onglet==="parametres" && <OngletParametres pinRH={pinRH} setPinRH={setPinRH} pinChef={pinChef} setPinChef={setPinChef} onChargerDemo={onChargerDemo} onReloadSupabase={onReloadSupabase} salaries={salaries} setSalaries={setSalaries} chantiers={chantiers} setChantiers={setChantiers} interimaires={interimaires} setInterimaires={setInterimaires} pointages={pointages} setPointages={setPointages} absences={absences} setAbsences={setAbsences}/>}
    </main>
  );
}

// ---- Onglet Pointages ----
// ---- Modal : import du planning vers les pointages ----
function ModalImportPlanning({onFermer, pointages, setPointages, salaries, chantiers, setChantiers}) {
  const [semOff, setSemOff]   = useState(0);          // 0 = semaine en cours
  const [etat, setEtat]       = useState("idle");      // idle | chargement | apercu | erreur
  const [erreur, setErreur]   = useState("");
  const [lignes, setLignes]   = useState([]);
  const [hDebut, setHDebut]   = useState(PLANNING_DEBUT_DEFAUT);
  const [hFin, setHFin]       = useState(PLANNING_FIN_DEFAUT);
  const [hPause, setHPause]   = useState(PLANNING_PAUSE_DEFAUT);

  const lundi = planningMonday(semOff);
  const vendredi = (()=>{const d=new Date(lundi);d.setDate(d.getDate()+5);return d;})();
  const fmtJ = (d)=>d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
  const libelleSemaine = `S${String(planningWeekNum(lundi)).padStart(2,"0")} · ${fmtJ(lundi)} au ${fmtJ(vendredi)} ${lundi.getFullYear()}`;

  const charger = async () => {
    setEtat("chargement"); setErreur("");
    try {
      const data = await chargerPlanning();
      const l = planningVersLignes(data, lundi, salaries, chantiers, pointages);
      setLignes(l);
      setEtat("apercu");
    } catch(e) { setErreur(e.message||"Erreur"); setEtat("erreur"); }
  };

  const majLigne = (i, champ, val) => setLignes(lignes.map((l,idx)=>idx===i?{...l,[champ]:val}:l));

  const nbAImporter = lignes.filter(l=>l.inclure && l.salarieId).length;
  const nbDoublons  = lignes.filter(l=>l.doublon).length;
  const nbNonRappro = lignes.filter(l=>!l.salarieId).length;

  const confirmer = () => {
    let chantiersMaj = chantiers;
    const aImporter = lignes.filter(l=>l.inclure && l.salarieId);
    const nouveaux = aImporter.map(l => {
      let chantierId = l.chantierId;
      if (chantierId === "__new__" && l.noteChantier) {
        const nv = {id:genId("C"),nom:l.noteChantier.trim(),ville:"—",client:"—",couleur:"#3D5A80",actif:true};
        chantiersMaj = [...chantiersMaj, nv];
        chantierId = nv.id;
      }
      const sal = salaries.find(s=>s.id===l.salarieId);
      const comm = l.manoeuvre ? ("Manœuvre : "+l.manoeuvre) : "";
      return {
        id:genId("P"), salarie:l.salarieId, chantier:chantierId||"", date:l.dateIso,
        debut:hDebut, fin:hFin, pause:hPause, commentaire:comm,
        valide:false, interim:false,
        valideParInterimaire:null, horodatageValidation:null,
        chefNom:(sal&&sal.nom)||l.nomChef||"—",
      };
    });
    if (chantiersMaj !== chantiers) setChantiers(chantiersMaj);
    if (nouveaux.length) setPointages([...pointages, ...nouveaux]);
    onFermer(nouveaux.length);
  };

  const wrap = {position:"fixed",inset:0,background:"rgba(10,10,10,0.55)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16};
  const carte = {background:C.papier,width:"100%",maxWidth:920,maxHeight:"90vh",display:"flex",flexDirection:"column",border:`1px solid ${C.encre}`,boxShadow:"0 20px 60px rgba(0,0,0,0.3)"};
  const lab = {fontFamily:FM,fontSize:9,letterSpacing:"0.15em",color:C.gris,fontWeight:700,marginBottom:4};
  const inp = {padding:"7px 8px",background:C.fond,border:`1.5px solid ${C.ligne}`,fontFamily:FM,fontSize:12,outline:"none",boxSizing:"border-box"};

  return (
    <div style={wrap} onClick={()=>onFermer(0)}>
      <div style={carte} onClick={e=>e.stopPropagation()}>
        <div style={{padding:"16px 20px",borderBottom:`1px solid ${C.ligne}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
          <div>
            <div style={{fontFamily:FM,fontSize:10,letterSpacing:"0.2em",color:C.gris}}>PASSERELLE</div>
            <div style={{fontFamily:FT,fontSize:20,fontWeight:800,letterSpacing:"-0.02em"}}>📅 Importer depuis le planning</div>
          </div>
          <Btn variant="ghost" onClick={()=>onFermer(0)}>✕</Btn>
        </div>

        <div style={{padding:"14px 20px",borderBottom:`1px solid ${C.ligne}`,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",flexShrink:0}}>
          <Btn variant="ghost" onClick={()=>{setSemOff(semOff-1);setEtat("idle");}}>◀ Préc.</Btn>
          <div style={{fontFamily:FM,fontSize:13,fontWeight:700,minWidth:230,textAlign:"center"}}>{libelleSemaine}</div>
          <Btn variant="ghost" onClick={()=>{setSemOff(semOff+1);setEtat("idle");}}>Suiv. ▶</Btn>
          {semOff!==0 && <Btn variant="ghost" onClick={()=>{setSemOff(0);setEtat("idle");}}>Aujourd'hui</Btn>}
          <div style={{flex:1}}/>
          <Btn onClick={charger} disabled={etat==="chargement"}>{etat==="chargement"?"CHARGEMENT…":"🔄 CHARGER LE PLANNING"}</Btn>
        </div>

        {etat==="apercu" && (
          <div style={{padding:"12px 20px",borderBottom:`1px solid ${C.ligne}`,display:"flex",gap:16,alignItems:"flex-end",flexWrap:"wrap",flexShrink:0,background:C.fond}}>
            <div><div style={lab}>DÉBUT (défaut)</div><input type="time" value={hDebut} onChange={e=>setHDebut(e.target.value)} style={{...inp,width:110}}/></div>
            <div><div style={lab}>FIN (défaut)</div><input type="time" value={hFin} onChange={e=>setHFin(e.target.value)} style={{...inp,width:110}}/></div>
            <div><div style={lab}>PAUSE (min)</div><input type="number" value={hPause} onChange={e=>setHPause(parseInt(e.target.value)||0)} style={{...inp,width:90,textAlign:"center"}}/></div>
            <div style={{fontSize:11,color:C.gris,maxWidth:360,lineHeight:1.4}}>Ces horaires sont appliqués à tous les pointages importés. Le chef d'équipe pourra les ajuster ensuite.</div>
          </div>
        )}

        <div style={{overflow:"auto",flex:1,padding:"0 0 8px"}}>
          {etat==="idle" && <div style={{padding:"48px 20px",textAlign:"center",color:C.gris,fontSize:13}}>Choisissez une semaine puis cliquez sur <b>Charger le planning</b>.</div>}
          {etat==="chargement" && <div style={{padding:"48px 20px",textAlign:"center",color:C.gris,fontFamily:FM,fontSize:12,letterSpacing:"0.1em"}}>CONNEXION AU PLANNING…</div>}
          {etat==="erreur" && <div style={{padding:"32px 20px"}}><div style={{padding:"14px 16px",background:"#FFF0F0",border:`1.5px solid ${C.orange}`,fontSize:13}}><b style={{color:C.orange}}>Erreur :</b> {erreur}<div style={{fontSize:11,color:C.gris,marginTop:8}}>Vérifiez l'URL du planning dans <b>Paramètres</b> (elle doit finir par <code>/exec</code>).</div></div></div>}

          {etat==="apercu" && lignes.length===0 && <div style={{padding:"48px 20px",textAlign:"center",color:C.gris,fontSize:13}}>Aucune affectation « chantier » trouvée pour cette semaine dans le planning.</div>}

          {etat==="apercu" && lignes.length>0 && (
            <>
              <div style={{padding:"12px 20px",display:"flex",gap:18,flexWrap:"wrap",fontSize:12}}>
                <span><b style={{color:C.vert}}>{nbAImporter}</b> à importer</span>
                {nbNonRappro>0 && <span><b style={{color:C.orange}}>{nbNonRappro}</b> salarié(s) non rapproché(s)</span>}
                {nbDoublons>0 && <span><b style={{color:C.gris}}>{nbDoublons}</b> doublon(s) déjà saisi(s)</span>}
              </div>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr style={{background:C.fond}}>
                    <Th></Th><Th>Jour</Th><Th>Planning (chef)</Th><Th>→ Salarié</Th><Th>Chantier planning</Th><Th>→ Chantier</Th>
                  </tr>
                </thead>
                <tbody>
                  {lignes.map((l,i)=>{
                    const jourNom = new Date(l.dateIso+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
                    return (
                      <tr key={l.key} style={{borderBottom:`1px solid ${C.ligne}`,background:l.doublon?"#F4F2EC":l.inclure?"transparent":"#FBFAF6",opacity:l.doublon?0.7:1}}>
                        <Td><input type="checkbox" checked={l.inclure} onChange={e=>majLigne(i,"inclure",e.target.checked)} disabled={!l.salarieId}/></Td>
                        <Td><span style={{fontSize:11,fontWeight:600}}>{jourNom}</span>{l.doublon&&<div style={{fontSize:9,color:C.gris}}>déjà saisi</div>}</Td>
                        <Td><span style={{fontSize:12,fontWeight:700}}>{l.nomChef}</span>{l.manoeuvre&&<div style={{fontSize:10,color:C.gris}}>+ manœuvre : {l.manoeuvre}</div>}</Td>
                        <Td>
                          <select value={l.salarieId} onChange={e=>majLigne(i,"salarieId",e.target.value)} style={{...inp,width:190,borderColor:l.salarieId?C.ligne:C.orange}}>
                            <option value="">— non rapproché —</option>
                            {salaries.map(s=><option key={s.id} value={s.id}>{s.nom}</option>)}
                          </select>
                        </Td>
                        <Td><span style={{fontSize:11,color:l.noteChantier?C.encre:C.gris}}>{l.noteChantier||"(vide)"}</span></Td>
                        <Td>
                          <select value={l.chantierId} onChange={e=>majLigne(i,"chantierId",e.target.value)} style={{...inp,width:180}}>
                            <option value="">— aucun —</option>
                            {chantiers.map(c=><option key={c.id} value={c.id}>{c.nom}</option>)}
                            {l.noteChantier && <option value="__new__">➕ Créer « {l.noteChantier} »</option>}
                          </select>
                        </Td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </>
          )}
        </div>

        <div style={{padding:"14px 20px",borderTop:`1px solid ${C.ligne}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0,gap:12,flexWrap:"wrap"}}>
          <div style={{fontSize:11,color:C.gris}}>{etat==="apercu"?`${nbAImporter} pointage(s) seront créés en statut « attente ».`:"Aucun pointage ne sera modifié sans confirmation."}</div>
          <div style={{display:"flex",gap:10}}>
            <Btn variant="ghost" onClick={()=>onFermer(0)}>ANNULER</Btn>
            <Btn onClick={confirmer} disabled={etat!=="apercu"||nbAImporter===0}>✓ IMPORTER {nbAImporter>0?`(${nbAImporter})`:""}</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

function OngletPointages({auj,pointagesTous,setPointages,chantiers,setChantiers,salaries,interimaires,trouver,aValider,valider,validerTout,supprPointage}) {
  const [filtre,setFiltre] = useState("tous");
  const [importOuvert,setImportOuvert] = useState(false);
  const [importMsg,setImportMsg] = useState("");
  const [editId,setEditId] = useState(null);
  const [editData,setEditData] = useState({});
  const [dateVue,setDateVue]=useState(auj);
  const decalerJour=(n)=>{const d=new Date(dateVue+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);const iso=d.toISOString().slice(0,10);if(iso>auj)return;setDateVue(iso);};
  const dateVueLabel=new Date(dateVue+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const listeDate=pointagesTous.filter(p=>p.date===dateVue);
  const aValiderDate=listeDate.filter(p=>!p.valide).length;
  const validerToutDate=()=>setPointages(pointagesTous.map(p=>p.date===dateVue?{...p,valide:true}:p));
  const liste = filtre==="tous" ? listeDate : listeDate.filter(p=>p.chantier===filtre);
  const semaineVue=(()=>{const d=new Date(dateVue+"T12:00:00Z"),day=d.getUTCDay()||7;const lundi=new Date(d);lundi.setUTCDate(d.getUTCDate()-day+1);return Array.from({length:7},(_,i)=>{const x=new Date(lundi);x.setUTCDate(lundi.getUTCDate()+i);return x.toISOString().slice(0,10);});})();
  const ptgSem=pointagesTous.filter(p=>semaineVue.includes(p.date));
  const alertesJour=listeDate.filter(p=>calcHeures(p)>10).map(p=>({id:p.id,niveau:"danger",msg:`${trouver(p.salarie)?.nom||p.salarie} — ${fmtH(calcHeures(p))}/jour (max légal : 10h)`}));
  const personnesSem=[...new Set(ptgSem.map(p=>p.salarie))];
  const alertesSemaine=personnesSem.flatMap(id=>{const total=ptgSem.filter(p=>p.salarie===id).reduce((s,p)=>s+calcHeures(p),0);if(total>48)return[{id,niveau:"danger",msg:`${trouver(id)?.nom||id} — ${fmtH(total)}/semaine (max légal : 48h)`}];if(total>44)return[{id,niveau:"warn",msg:`${trouver(id)?.nom||id} — ${fmtH(total)}/semaine (seuil : 44h)`}];return[];});
  const toutesAlertes=[...alertesJour,...alertesSemaine];
  const iStyle={padding:"6px 8px",background:C.papier,border:`1.5px solid ${C.encre}`,fontFamily:FM,fontSize:12,outline:"none",width:"100%",boxSizing:"border-box"};
  const ouvrirEdit=(p)=>{setEditId(p.id);setEditData({debut:p.debut,fin:p.fin,pause:p.pause,chantier:p.chantier,commentaire:p.commentaire||"",deplacement:!!p.deplacement});};
  const annulerEdit=()=>{setEditId(null);setEditData({});};
  const sauvegarderEdit=(id)=>{setPointages(pointagesTous.map(p=>p.id===id?{...p,...editData,modifiePar:"RH",modifieLe:new Date().toISOString()}:p));setEditId(null);setEditData({});};
  return (
    <Section titre="Pointages" actions={
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        <select value={filtre} onChange={e=>setFiltre(e.target.value)} style={selectStyle}>
          <option value="tous">Tous les chantiers</option>
          {chantiers.map(c=><option key={c.id} value={c.id}>{c.nom}</option>)}
        </select>
        {aValiderDate>0 && <Btn onClick={validerToutDate}>✓ TOUT VALIDER ({aValiderDate})</Btn>}
      </div>
    }>
      {/* Navigation dans le temps — sans limite dans le passé */}
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:16,padding:"10px 14px",background:C.fond,border:`1.5px solid ${C.ligne}`}}>
        <Btn variant="ghost" onClick={()=>decalerJour(-1)}>◀ JOUR PRÉCÉDENT</Btn>
        <input type="date" value={dateVue} max={auj} onChange={e=>{if(e.target.value)setDateVue(e.target.value);}} style={{padding:"8px 10px",background:C.papier,border:`1.5px solid ${C.encre}`,fontFamily:FM,fontSize:13,fontWeight:700,outline:"none"}}/>
        <div style={{flex:1,minWidth:180,fontFamily:FT,fontSize:16,fontWeight:800,textTransform:"capitalize"}}>{dateVueLabel}{dateVue===auj&&<span style={{fontSize:11,color:C.gris,fontWeight:600,marginLeft:8}}>(aujourd'hui)</span>}</div>
        {dateVue<auj&&<Btn variant="ghost" onClick={()=>decalerJour(1)}>JOUR SUIVANT ▶</Btn>}
        {dateVue!==auj&&<Btn variant="ghost" onClick={()=>setDateVue(auj)}>⭯ REVENIR À AUJOURD'HUI</Btn>}
      </div>
      {toutesAlertes.length>0 && <div style={{marginBottom:16}}>{toutesAlertes.map((a,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",marginBottom:6,background:a.niveau==="danger"?"#FFF0F0":"#FFF8E1",border:`1.5px solid ${a.niveau==="danger"?C.orange:"#F39C12"}`}}>
          <span style={{fontSize:18}}>{a.niveau==="danger"?"🔴":"🟠"}</span>
          <div><div style={{fontFamily:FM,fontSize:11,fontWeight:700,color:a.niveau==="danger"?C.orange:"#B7770D"}}>{a.niveau==="danger"?"DÉPASSEMENT LÉGAL":"SEUIL D'ALERTE"}</div><div style={{fontSize:12,marginTop:2}}>{a.msg}</div></div>
        </div>
      ))}</div>}
      {liste.length===0
        ? <EmptyState>Aucun pointage pour le {dateVueLabel}.<br/><small style={{color:C.gris}}>Utilisez les flèches ou le calendrier ci-dessus pour changer de date.</small></EmptyState>
        : <TableWrap>
            <thead><tr><Th>Date</Th><Th>Personne</Th><Th>Statut</Th><Th>Chantier</Th><Th r>Début</Th><Th r>Fin</Th><Th r>Pause</Th><Th r>Total</Th><Th r>H.Nuit</Th><Th r>H.100%</Th><Th>Logé</Th><Th>Commentaire</Th><Th>État RH</Th><Th></Th></tr></thead>
            <tbody>{liste.map(p=>{
              const pers=trouver(p.salarie);const ch=chantiers.find(c=>c.id===p.chantier);const ag=p.interim?AGENCES.find(a=>a.id===pers?.agence):null;
              const dateCourte=p.date?new Date(p.date+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}):"—";
              const hTot=calcHeures(p);const hNuit=calcHNuit(p);const enEdition=editId===p.id;
              const hEdit=enEdition?calcHeures({...p,...editData}):hTot;
              return(<tr key={p.id} style={{borderBottom:`1px solid ${C.ligne}`,background:hTot>10?"#FFF8F8":enEdition?"#FFFDE7":"transparent"}}>
                <Td><span style={{fontSize:11,fontWeight:500}}>{dateCourte}</span>{p.modifiePar&&<div style={{fontSize:9,color:C.gris,marginTop:2}}>✎ Modifié RH</div>}</Td>
                <Td><b style={{fontSize:13}}>{pers?.nom||p.salarie}</b><br/><span style={{fontSize:11,color:C.gris}}>{pers?.poste||"—"}{p.chefNom?` · Chef: ${p.chefNom}`:""}</span></Td>
                <Td>{p.interim?<span style={{fontSize:10,padding:"3px 8px",color:"#fff",fontWeight:700,background:ag?.couleur}}>{ag?.nom||"INTÉRIM"}</span>:<span style={{fontSize:10,padding:"3px 8px",fontWeight:700,border:`1px solid ${C.encre}`}}>INTERNE</span>}</Td>
                <Td>{enEdition?<select value={editData.chantier} onChange={e=>setEditData({...editData,chantier:e.target.value})} style={{...iStyle,width:160}}>{chantiers.map(c=><option key={c.id} value={c.id}>{c.nom}</option>)}</select>:ch?<span style={{fontSize:11,padding:"3px 8px",fontWeight:700,background:ch.couleur,color:ch.couleur==="#F5C518"?"#0A0A0A":"#fff"}}>{ch.nom}</span>:"—"}</Td>
                <Td r>{enEdition?<input type="time" value={editData.debut} onChange={e=>setEditData({...editData,debut:e.target.value})} style={{...iStyle,width:90,textAlign:"center"}}/>:p.debut}</Td>
                <Td r>{enEdition?<input type="time" value={editData.fin} onChange={e=>setEditData({...editData,fin:e.target.value})} style={{...iStyle,width:90,textAlign:"center"}}/>:p.fin}</Td>
                <Td r>{enEdition?<input type="number" value={editData.pause} onChange={e=>setEditData({...editData,pause:parseInt(e.target.value)||0})} style={{...iStyle,width:70,textAlign:"center"}}/>:`${p.pause}min`}</Td>
                <Td r><b style={{color:hEdit>10?C.orange:"inherit"}}>{fmtH(enEdition?hEdit:hTot)}</b></Td>
                <Td r>{hNuit>0?<span style={{color:"#6C3483",fontWeight:700,fontSize:11}}>{fmtH(hNuit)}</span>:<span style={{color:C.ligne}}>—</span>}</Td>
                <Td r>{(()=>{const h100=calcH100(p);return h100>0?<span style={{color:"#C0392B",fontWeight:700,fontSize:11}} title={nomFerie(p.date)||"Dimanche"}>{fmtH(h100)}</span>:<span style={{color:C.ligne}}>—</span>;})()}</Td>
                <Td>{enEdition
                  ? <label style={{display:"flex",alignItems:"center",gap:6,fontSize:10,cursor:"pointer",fontWeight:700}}><input type="checkbox" checked={!!editData.deplacement} onChange={e=>setEditData({...editData,deplacement:e.target.checked})}/>🛏</label>
                  : p.deplacement?<span style={{fontSize:10,padding:"3px 8px",fontWeight:700,color:"#fff",background:C.bleu}} title="Déplacement avec logement">🛏 LOGÉ</span>:<span style={{color:C.ligne,fontSize:10}}>—</span>}</Td>
                <Td>{enEdition?<textarea value={editData.commentaire||""} onChange={e=>setEditData({...editData,commentaire:e.target.value})} rows={2} style={{...iStyle,width:160,resize:"vertical",fontSize:11}}/>:p.commentaire?<span style={{fontSize:10,color:"#6C3483",fontStyle:"italic"}}>💬 {p.commentaire}</span>:<span style={{color:C.ligne,fontSize:10}}>—</span>}</Td>
                <Td>{p.valide?<span style={{color:C.vert,fontSize:11,fontWeight:700}}>● VALIDÉ</span>:<span style={{color:C.orange,fontSize:11,fontWeight:700}}>● ATTENTE</span>}</Td>
                <Td>{enEdition?(<div style={{display:"flex",gap:6,flexDirection:"column"}}><Btn variant="mini" onClick={()=>sauvegarderEdit(p.id)}>✓ SAUVER</Btn><Btn variant="ghost" onClick={annulerEdit}>ANNULER</Btn></div>):(<div style={{display:"flex",gap:6}}><Btn variant="ghost" onClick={()=>ouvrirEdit(p)}>✎</Btn>{!p.valide&&<Btn variant="mini" onClick={()=>valider(p.id)}>✓</Btn>}<Btn variant="danger-mini" onClick={()=>supprPointage(p.id)}>✕</Btn></div>)}</Td>
              </tr>);
            })}</tbody>
          </TableWrap>
      }
      <div style={{marginTop:12,fontSize:11,color:C.gris,display:"flex",gap:20,flexWrap:"wrap"}}>
        <span>🔴 Dépassement légal (&gt;10h/j ou &gt;48h/sem)</span>
        <span>🟠 Seuil d'alerte (&gt;44h/sem)</span>
      </div>
    </Section>
  );
}

// ---- Onglet Absences ----
function OngletAbsences({absences,setAbsences,salaries,interimaires,pointages}) {
  const auj = new Date().toISOString().slice(0,10);
  const [open,setOpen]=useState(false);
  const [personneId,setPersonneId]=useState("");
  const [dateDebut,setDateDebut]=useState(auj);
  const [dateFin,setDateFin]=useState(auj);
  const [type,setType]=useState(TYPES_ABSENCE[0].code);
  const [commentaire,setCommentaire]=useState("");
  const [err,setErr]=useState("");
  const [filtreType,setFiltreType]=useState("tous");
  const [filtrePersonne,setFiltrePersonne]=useState("tous");
  const tousPersonnes=[...salaries.map(s=>({...s,_type:"interne"})),...interimaires.map(i=>({...i,_type:"interim"}))];
  const ajouter=()=>{
    if(!personneId){setErr("Sélectionnez une personne.");return;}
    if(dateDebut>dateFin){setErr("La date de fin doit être après la date de début.");return;}
    const typeInfo=TYPES_ABSENCE.find(t=>t.code===type);
    setAbsences([...absences,{id:genId("A"),salarie:personneId,dateDebut,dateFin,type,typeLabel:typeInfo.label,typeIcone:typeInfo.icone,commentaire:commentaire.trim(),saisieParRH:true,saisieDate:new Date().toISOString()}]);
    setPersonneId("");setDateDebut(auj);setDateFin(auj);setType(TYPES_ABSENCE[0].code);setCommentaire("");setOpen(false);setErr("");
  };
  const supprimer=(id)=>{if(!window.confirm("Supprimer cette absence ?"))return;setAbsences(absences.filter(a=>a.id!==id));};
  // Jours ouvrés = lundi→vendredi, hors jours fériés (cohérent avec le solde de congés)
  const nbJoursOuvres=(d1,d2)=>joursAbsenceAnnee({dateDebut:d1,dateFin:d2},null);
  const listeFiltree=absences.filter(a=>filtreType==="tous"||a.type===filtreType).filter(a=>filtrePersonne==="tous"||a.salarie===filtrePersonne).sort((a,b)=>b.dateDebut.localeCompare(a.dateDebut));
  const fmtDate=(iso)=>new Date(iso+"T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
  return (
    <Section titre={`Absences & Congés — ${absences.length}`} actions={<Btn onClick={()=>{setOpen(!open);setErr("");}}>{open?"✕ Annuler":"+ SAISIR UNE ABSENCE"}</Btn>}>
      {/* Soldes de congés payés de l'année en cours */}
      {salaries.length>0&&(()=>{const annee=new Date().getFullYear();const soldes=salaries.map(s=>({s,bc:bilanConges(s,absences,annee)}));const alerte=soldes.filter(x=>x.bc.restant<=5);
        return(<div style={{marginBottom:20}}>
          <div style={{fontFamily:FM,fontSize:10,letterSpacing:"0.2em",color:C.gris,fontWeight:700,marginBottom:10}}>SOLDES CONGÉS PAYÉS {annee} — EN JOURS OUVRÉS (HORS WEEK-ENDS ET FÉRIÉS)</div>
          {alerte.length>0&&<div style={{marginBottom:10,padding:"9px 14px",background:"#FFF8E1",border:`1.5px solid ${C.jaune}`,fontSize:11,fontWeight:600}}>⚠ {alerte.length} salarié(s) avec 5 jours ou moins de congés restants : {alerte.map(x=>x.s.nom).join(", ")}</div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(190px,1fr))",gap:8}}>
            {soldes.map(({s,bc})=>(
              <div key={s.id} style={{padding:"9px 12px",background:C.papier,border:`1px solid ${bc.restant<0?C.orange:bc.restant<=5?C.jaune:C.ligne}`,fontSize:11}}>
                <div style={{fontWeight:700,marginBottom:4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{s.nom}</div>
                <div><b style={{fontFamily:FT,fontSize:18,color:bc.restant<0?C.orange:C.vert}}>{bc.restant}</b><span style={{color:C.gris}}> / {bc.droit} j. · {bc.pris} pris</span></div>
              </div>
            ))}
          </div>
        </div>);})()}
      {open&&<FormInline>
        <div style={{fontFamily:FM,fontSize:10,letterSpacing:"0.2em",color:C.gris,fontWeight:700,marginBottom:12}}>NOUVELLE ABSENCE / CONGÉ</div>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end",marginBottom:12}}>
          <Champ label="PERSONNE"><select value={personneId} onChange={e=>{setPersonneId(e.target.value);setErr("");}} style={selectStyle}><option value="" disabled>— Sélectionner —</option>{salaries.length>0&&<optgroup label="── Salariés CHOK BÉTON">{salaries.map(s=><option key={s.id} value={s.id}>{s.nom}</option>)}</optgroup>}{interimaires.length>0&&<optgroup label="── Intérimaires">{interimaires.map(i=><option key={i.id} value={i.id}>{i.nom}</option>)}</optgroup>}</select></Champ>
          <Champ label="TYPE"><select value={type} onChange={e=>setType(e.target.value)} style={selectStyle}>{TYPES_ABSENCE.map(t=><option key={t.code} value={t.code}>{t.icone} {t.label}</option>)}</select></Champ>
          <Champ label="DÉBUT"><input type="date" value={dateDebut} onChange={e=>setDateDebut(e.target.value)} style={inputStyle}/></Champ>
          <Champ label="FIN"><input type="date" value={dateFin} onChange={e=>setDateFin(e.target.value)} style={inputStyle}/></Champ>
          {dateDebut&&dateFin&&dateDebut<=dateFin&&<div style={{padding:"0 0 2px",fontSize:12,color:C.gris,alignSelf:"flex-end"}}>→ <b>{nbJoursOuvres(dateDebut,dateFin)}</b> jour(s) ouvré(s)</div>}
        </div>
        <div style={{display:"flex",gap:12,alignItems:"flex-end"}}>
          <Champ label="COMMENTAIRE (OPTIONNEL)" style={{flex:1}}><input value={commentaire} onChange={e=>setCommentaire(e.target.value)} placeholder="Justificatif..." style={{...inputStyle,minWidth:300}}/></Champ>
          <Btn onClick={ajouter}>ENREGISTRER</Btn>
        </div>
        {err&&<ErrBox>{err}</ErrBox>}
      </FormInline>}
      {absences.length>0&&<div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}><select value={filtreType} onChange={e=>setFiltreType(e.target.value)} style={selectStyle}><option value="tous">Tous les types</option>{TYPES_ABSENCE.map(t=><option key={t.code} value={t.code}>{t.icone} {t.label}</option>)}</select><select value={filtrePersonne} onChange={e=>setFiltrePersonne(e.target.value)} style={selectStyle}><option value="tous">Toutes les personnes</option>{salaries.map(s=><option key={s.id} value={s.id}>{s.nom}</option>)}{interimaires.map(i=><option key={i.id} value={i.id}>{i.nom}</option>)}</select><span style={{fontSize:11,color:C.gris}}>{listeFiltree.length} résultat(s)</span></div>}
      {absences.length===0?<EmptyState>Aucune absence. Cliquez sur "+ SAISIR UNE ABSENCE".</EmptyState>
        :listeFiltree.length===0?<EmptyState>Aucun résultat pour ces filtres.</EmptyState>
        :<TableWrap><thead><tr><Th>Personne</Th><Th>Type</Th><Th>Début</Th><Th>Fin</Th><Th r>Jours ouvrés</Th><Th>Commentaire</Th><Th></Th></tr></thead>
          <tbody>{listeFiltree.map(a=>{const typeInfo=TYPES_ABSENCE.find(t=>t.code===a.type);const jours=nbJoursOuvres(a.dateDebut,a.dateFin);const personne=tousPersonnes.find(p=>p.id===a.salarie);
          return(<tr key={a.id} style={{borderBottom:`1px solid ${C.ligne}`}}><Td><b>{personne?.nom||a.salarie}</b></Td><Td><span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",background:typeInfo?.couleur+"22",border:`1px solid ${typeInfo?.couleur}`,fontSize:11,fontWeight:700,color:typeInfo?.couleur}}>{typeInfo?.icone} {typeInfo?.label}</span></Td><Td>{fmtDate(a.dateDebut)}</Td><Td>{fmtDate(a.dateFin)}</Td><Td r><b style={{fontFamily:FT,fontSize:16}}>{jours}</b> <span style={{fontSize:10,color:C.gris}}>j.</span></Td><Td>{a.commentaire?<span style={{fontSize:11,color:"#6C3483",fontStyle:"italic"}}>💬 {a.commentaire}</span>:<span style={{color:C.ligne}}>—</span>}</Td><Td><Btn variant="danger" onClick={()=>supprimer(a.id)}>SUPPR.</Btn></Td></tr>);
          })}</tbody></TableWrap>
      }
    </Section>
  );
}

// ---- Onglet Salariés (avec import en masse) ----
function OngletSalaries({salaries,setSalaries,pointages,absences}) {
  const anneeCourante = new Date().getFullYear();
  const [open,setOpen]=useState(false);
  const [nom,setNom]=useState("");
  const [poste,setPoste]=useState(POSTES[0]);
  const [err,setErr]=useState("");
  const [importOpen,setImportOpen]=useState(false);
  const [importTexte,setImportTexte]=useState("");
  const [importPreview,setImportPreview]=useState([]);

  const ajouter=()=>{
    if(nom.trim().length<2){setErr("Nom trop court.");return;}
    if(salaries.some(s=>s.nom.toLowerCase()===nom.trim().toLowerCase())){setErr("Déjà enregistré.");return;}
    setSalaries([...salaries,{id:genId("S"),nom:nom.trim(),poste,equipe:"—",interne:true}]);
    setNom("");setPoste(POSTES[0]);setOpen(false);setErr("");
  };
  const supprimer=(id)=>{
    if(pointages.some(p=>p.salarie===id)&&!window.confirm("Ce salarié a des pointages. Supprimer quand même ?"))return;
    setSalaries(salaries.filter(s=>s.id!==id));
  };

  const [editId,setEditId]=useState(null);
  const [editNom,setEditNom]=useState("");
  const [editPoste,setEditPoste]=useState(POSTES[0]);
  const [editCode,setEditCode]=useState(CODE_DEFAUT);
  const [editConges,setEditConges]=useState(CONGES_DEFAUT);
  const [editErr,setEditErr]=useState("");
  const ouvrirEdit=(s)=>{setEditId(s.id);setEditNom(s.nom);setEditPoste(s.poste||POSTES[0]);setEditCode(codeDe(s));setEditConges(congesDe(s));setEditErr("");};
  const annulerEdit=()=>{setEditId(null);setEditNom("");setEditErr("");};
  const sauverEdit=(id)=>{
    const n=editNom.trim();
    if(n.length<2){setEditErr("Nom trop court.");return;}
    if(salaries.some(s=>s.id!==id&&s.nom.toLowerCase()===n.toLowerCase())){setEditErr("Ce nom existe déjà.");return;}
    const c=String(editCode||"").trim();
    if(!/^\d{4}$/.test(c)){setEditErr("Le code doit comporter 4 chiffres.");return;}
    const cg=Number(editConges);
    if(!Number.isFinite(cg)||cg<0||cg>60){setEditErr("Congés : nombre de jours invalide (0 à 60).");return;}
    setSalaries(salaries.map(s=>s.id===id?{...s,nom:n,poste:editPoste,code:c,conges:cg}:s));
    setEditId(null);setEditNom("");setEditErr("");
  };
  const reinitCode=(s)=>{
    if(!window.confirm(`Réinitialiser le code de ${s.nom} à ${CODE_DEFAUT} ?`))return;
    setSalaries(salaries.map(x=>x.id===s.id?{...x,code:CODE_DEFAUT}:x));
  };

  const detecterPoste=(l)=>{
    const ll=l.toLowerCase();
    if(ll.includes(" ce ")||ll.includes("chef")||ll.endsWith(" ce")||ll.includes("(ce)")||ll.includes("chef d'équipe")) return "Chef d'équipe";
    return "Chef d'équipe";
  };
  const nettoyerNom=(l)=>l.replace(/\s*[-–—]\s*(CE|chef d'équipe|manœuvre|mano|maçon)\s*$/i,"").replace(/\s*\((CE|chef|mano)\)/gi,"").trim();

  const analyserImport=(texte)=>{
    const lignes=texte.split("\n").map(l=>l.trim()).filter(l=>l.length>2);
    return lignes.map(l=>({
      nomBrut:l,
      nom:nettoyerNom(l),
      poste:detecterPoste(l),
      doublon:salaries.some(s=>s.nom.toLowerCase()===nettoyerNom(l).toLowerCase()),
    }));
  };

  const handleImportTexte=(v)=>{setImportTexte(v);setImportPreview(analyserImport(v));};
  const confirmerImport=()=>{
    const nouveaux=importPreview.filter(r=>!r.doublon&&r.nom.length>2).map(r=>({id:genId("S"),nom:r.nom,poste:r.poste,equipe:"—",interne:true}));
    setSalaries([...salaries,...nouveaux]);
    setImportTexte("");setImportPreview([]);setImportOpen(false);
  };

  return (
    <Section titre={`Salariés CHOK BÉTON — ${salaries.length}`} actions={
      <div style={{display:"flex",gap:8}}>
        <Btn variant="ghost" onClick={()=>{setImportOpen(!importOpen);setOpen(false);}}>{importOpen?"✕ Annuler":"↑ IMPORT EN MASSE"}</Btn>
        <Btn onClick={()=>{setOpen(!open);setImportOpen(false);}}>{open?"✕ Annuler":"+ AJOUTER"}</Btn>
      </div>
    }>
      {open&&<FormInline>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
          <Champ label="NOM COMPLET"><input value={nom} onChange={e=>{setNom(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&ajouter()} placeholder="NOM Prénom" style={inputStyle}/></Champ>
          <Champ label="POSTE"><select value={poste} onChange={e=>setPoste(e.target.value)} style={selectStyle}>{POSTES.map(p=><option key={p}>{p}</option>)}</select></Champ>
          <Btn onClick={ajouter}>AJOUTER</Btn>
        </div>
        {err&&<ErrBox>{err}</ErrBox>}
      </FormInline>}

      {importOpen&&<FormInline>
        <div style={{fontFamily:FM,fontSize:10,letterSpacing:"0.2em",color:C.gris,fontWeight:700,marginBottom:12}}>IMPORT EN MASSE — UN NOM PAR LIGNE</div>
        <div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap",fontSize:11,color:C.gris}}>
          Format libre : <code style={{background:C.fond,padding:"2px 6px",fontSize:11}}>DUPONT Jean</code> ou <code style={{background:C.fond,padding:"2px 6px",fontSize:11}}>Jean Dupont</code>
        </div>
        <textarea value={importTexte} onChange={e=>handleImportTexte(e.target.value)} placeholder={"ADOU Stéphane\nBAKAYOKO Moussa\n..."} rows={8} style={{width:"100%",padding:"10px",background:C.fond,border:`1.5px solid ${C.encre}`,fontFamily:FM,fontSize:12,outline:"none",resize:"vertical",boxSizing:"border-box",marginBottom:12}}/>
        {importPreview.length>0&&(
          <div style={{marginBottom:12}}>
            <div style={{fontSize:10,color:C.gris,letterSpacing:"0.1em",marginBottom:8}}>
              APERÇU — {importPreview.filter(r=>!r.doublon&&r.nom.length>2).length} à importer, {importPreview.filter(r=>r.doublon).length} doublon(s)
            </div>
            <div style={{maxHeight:200,overflowY:"auto",border:`1px solid ${C.ligne}`}}>
              {importPreview.map((r,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 12px",borderBottom:`1px solid ${C.ligne}`,background:r.doublon?"#FFF8E1":"transparent",fontSize:12}}>
                  <span style={{color:r.doublon?C.orange:C.vert,fontSize:14}}>{r.doublon?"⚠":"✓"}</span>
                  <span style={{flex:1}}>{r.nom}</span>
                  <span style={{fontSize:10,color:C.gris}}>{r.poste}</span>
                  {r.doublon&&<span style={{fontSize:9,color:C.orange,fontWeight:700}}>DOUBLON</span>}
                </div>
              ))}
            </div>
          </div>
        )}
        <Btn onClick={confirmerImport} disabled={importPreview.filter(r=>!r.doublon&&r.nom.length>2).length===0}>
          ✓ IMPORTER {importPreview.filter(r=>!r.doublon&&r.nom.length>2).length} SALARIÉ(S)
        </Btn>
      </FormInline>}

      {salaries.length===0
        ? <EmptyState>Aucun salarié. Cliquez sur "+ AJOUTER" ou "↑ IMPORT EN MASSE".</EmptyState>
        : <TableWrap>
            <thead><tr><Th>Nom</Th><Th>Poste</Th><Th>Code accès</Th><Th r>Congés {anneeCourante}</Th><Th r>Pointages</Th><Th></Th></tr></thead>
            <tbody>{salaries.map(s=>{
              const jours=pointages.filter(p=>p.salarie===s.id).length;
              const bc=bilanConges(s,absences,anneeCourante);
              if(editId===s.id) return <tr key={s.id} style={{borderBottom:`1px solid ${C.ligne}`,background:"#FFFDE7"}}>
                <Td><input value={editNom} onChange={e=>{setEditNom(e.target.value);setEditErr("");}} onKeyDown={e=>{if(e.key==="Enter")sauverEdit(s.id);if(e.key==="Escape")annulerEdit();}} autoFocus style={{...inputStyle,minWidth:200}}/>{editErr&&<div style={{color:C.orange,fontSize:11,fontWeight:700,marginTop:4}}>{editErr}</div>}</Td>
                <Td><select value={editPoste} onChange={e=>setEditPoste(e.target.value)} style={selectStyle}>{POSTES.map(p=><option key={p}>{p}</option>)}</select></Td>
                <Td><input value={editCode} onChange={e=>{setEditCode(e.target.value.replace(/\D/g,"").slice(0,4));setEditErr("");}} maxLength={4} placeholder="4 chiffres" style={{...inputStyle,width:90,textAlign:"center",letterSpacing:"0.2em"}}/></Td>
                <Td r><input type="number" value={editConges} onChange={e=>{setEditConges(e.target.value);setEditErr("");}} min={0} max={60} style={{...inputStyle,width:80,textAlign:"center"}}/><div style={{fontSize:9,color:C.gris,marginTop:3}}>jours/an</div></Td>
                <Td r>{jours}</Td>
                <Td><div style={{display:"flex",gap:6,justifyContent:"flex-end"}}><Btn onClick={()=>sauverEdit(s.id)}>✓ ENREGISTRER</Btn><Btn variant="ghost" onClick={annulerEdit}>ANNULER</Btn></div></Td>
              </tr>;
              return <tr key={s.id} style={{borderBottom:`1px solid ${C.ligne}`}}>
                <Td><div style={{display:"flex",alignItems:"center",gap:10}}><Avatar nom={s.nom}/><div><b>{s.nom}</b><div style={{fontSize:9,color:C.gris}}>{s.id}</div></div></div></Td>
                <Td><span style={{fontSize:10,padding:"3px 8px",fontWeight:700,border:`1px solid ${C.encre}`}}>{s.poste}</span></Td>
                <Td><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontFamily:FM,fontSize:13,fontWeight:700,letterSpacing:"0.15em",padding:"3px 8px",background:codeDe(s)===CODE_DEFAUT?"#FFF8E1":C.fond,border:`1px solid ${codeDe(s)===CODE_DEFAUT?C.jaune:C.ligne}`}}>{codeDe(s)}</span>{codeDe(s)!==CODE_DEFAUT&&<button onClick={()=>reinitCode(s)} title="Réinitialiser le code" style={{background:"transparent",border:"none",cursor:"pointer",fontSize:12,color:C.gris}}>⟲</button>}</div>{codeDe(s)===CODE_DEFAUT&&<div style={{fontSize:9,color:"#B7770D",fontWeight:700,marginTop:2}}>code par défaut</div>}</Td>
                <Td r><b style={{fontFamily:FT,fontSize:16,color:bc.restant<0?C.orange:C.encre}}>{bc.restant}</b><span style={{fontSize:10,color:C.gris}}> / {bc.droit} j.</span><div style={{fontSize:9,color:C.gris,marginTop:2}}>{bc.pris} pris</div></Td>
                <Td r>{jours}</Td>
                <Td><div style={{display:"flex",gap:6,justifyContent:"flex-end"}}><Btn variant="ghost" onClick={()=>ouvrirEdit(s)}>✎ MODIFIER</Btn><Btn variant="danger" onClick={()=>supprimer(s.id)}>SUPPRIMER</Btn></div></Td>
              </tr>;
            })}</tbody>
          </TableWrap>
      }
    </Section>
  );
}

// ---- Onglet Intérimaires ----
function OngletInterim({interimaires,setInterimaires,pointages,chantiers}) {
  const [open,setOpen]=useState(false);
  const [nom,setNom]=useState("");
  const [poste,setPoste]=useState("Manœuvre");
  const [agence,setAgence]=useState(AGENCES[0].id);
  const [err,setErr]=useState("");
  const ajouter=()=>{if(nom.trim().length<2){setErr("Nom trop court.");return;}if(interimaires.some(i=>i.nom.toLowerCase()===nom.trim().toLowerCase())){setErr("Déjà enregistré.");return;}setInterimaires([...interimaires,{id:genId("I"),nom:nom.trim(),poste,agence,accesPlateforme:false}]);setNom("");setPoste("Manœuvre");setAgence(AGENCES[0].id);setOpen(false);setErr("");};
  const supprimer=(id)=>{if(pointages.some(p=>p.salarie===id)&&!window.confirm("Cet intérimaire a des pointages. Supprimer ?"))return;setInterimaires(interimaires.filter(i=>i.id!==id));};
  const stats=(id)=>{const ps=pointages.filter(p=>p.salarie===id);return{j:ps.length,h:ps.reduce((s,p)=>s+calcHeures(p),0)};};
  const [editId,setEditId]=useState(null);
  const [eNom,setENom]=useState("");
  const [ePoste,setEPoste]=useState("Manœuvre");
  const [eAgence,setEAgence]=useState(AGENCES[0].id);
  const [eErr,setEErr]=useState("");
  const [eCode,setECode]=useState(CODE_DEFAUT);
  const ouvrirEdit=(i)=>{setEditId(i.id);setENom(i.nom);setEPoste(i.poste||"Manœuvre");setEAgence(i.agence||AGENCES[0].id);setECode(codeDe(i));setEErr("");};
  const annulerEdit=()=>{setEditId(null);setENom("");setEErr("");};
  const sauverEdit=(id)=>{const n=eNom.trim();if(n.length<2){setEErr("Nom trop court.");return;}if(interimaires.some(i=>i.id!==id&&i.nom.toLowerCase()===n.toLowerCase())){setEErr("Ce nom existe déjà.");return;}const c=String(eCode||"").trim();if(!/^\d{4}$/.test(c)){setEErr("Le code doit comporter 4 chiffres.");return;}setInterimaires(interimaires.map(i=>i.id===id?{...i,nom:n,poste:ePoste,agence:eAgence,code:c}:i));setEditId(null);setENom("");setEErr("");};
  return (
    <Section titre={`Intérimaires — ${interimaires.length}`} actions={<Btn onClick={()=>{setOpen(!open);setErr("");}}>{open?"✕ Annuler":"+ AJOUTER UN INTÉRIMAIRE"}</Btn>}>
      {open&&<FormInline><div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}><Champ label="NOM COMPLET"><input value={nom} onChange={e=>{setNom(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&ajouter()} placeholder="Prénom Nom" style={inputStyle}/></Champ><Champ label="POSTE"><select value={poste} onChange={e=>setPoste(e.target.value)} style={selectStyle}>{POSTES.map(p=><option key={p}>{p}</option>)}</select></Champ><Champ label="AGENCE"><select value={agence} onChange={e=>setAgence(e.target.value)} style={selectStyle}>{AGENCES.map(a=><option key={a.id} value={a.id}>{a.nom}</option>)}</select></Champ><Btn onClick={ajouter}>AJOUTER</Btn></div>{err&&<ErrBox>{err}</ErrBox>}</FormInline>}
      {interimaires.length===0?<EmptyState>Aucun intérimaire. Ajoutez-les ici ou depuis l'app chef d'équipe.</EmptyState>
        :<TableWrap><thead><tr><Th>Nom</Th><Th>Poste</Th><Th>Agence</Th><Th>Code accès</Th><Th r>Jours</Th><Th r>Heures</Th><Th></Th></tr></thead>
          <tbody>{interimaires.map(i=>{const ag=AGENCES.find(a=>a.id===i.agence);const s=stats(i.id);
            if(editId===i.id) return<tr key={i.id} style={{borderBottom:`1px solid ${C.ligne}`,background:"#FFFDE7"}}><Td><input value={eNom} onChange={e=>{setENom(e.target.value);setEErr("");}} onKeyDown={e=>{if(e.key==="Enter")sauverEdit(i.id);if(e.key==="Escape")annulerEdit();}} autoFocus style={{...inputStyle,minWidth:180}}/>{eErr&&<div style={{color:C.orange,fontSize:11,fontWeight:700,marginTop:4}}>{eErr}</div>}</Td><Td><select value={ePoste} onChange={e=>setEPoste(e.target.value)} style={selectStyle}>{POSTES.map(p=><option key={p}>{p}</option>)}</select></Td><Td><select value={eAgence} onChange={e=>setEAgence(e.target.value)} style={selectStyle}>{AGENCES.map(a=><option key={a.id} value={a.id}>{a.nom}</option>)}</select></Td><Td><input value={eCode} onChange={e=>{setECode(e.target.value.replace(/\D/g,"").slice(0,4));setEErr("");}} maxLength={4} placeholder="4 chiffres" style={{...inputStyle,width:90,textAlign:"center",letterSpacing:"0.2em"}}/></Td><Td r>{s.j}</Td><Td r><b>{fmtH(s.h)}</b></Td><Td><div style={{display:"flex",gap:6,justifyContent:"flex-end"}}><Btn onClick={()=>sauverEdit(i.id)}>✓ ENREGISTRER</Btn><Btn variant="ghost" onClick={annulerEdit}>ANNULER</Btn></div></Td></tr>;
            return<tr key={i.id} style={{borderBottom:`1px solid ${C.ligne}`}}><Td><div style={{display:"flex",alignItems:"center",gap:10}}><Avatar nom={i.nom} bg={ag?.couleur} light/><b>{i.nom}</b></div></Td><Td>{i.poste}</Td><Td><span style={{fontSize:10,padding:"3px 8px",fontWeight:700,color:"#fff",background:ag?.couleur}}>{ag?.nom}</span></Td><Td><span style={{fontFamily:FM,fontSize:13,fontWeight:700,letterSpacing:"0.15em",padding:"3px 8px",background:codeDe(i)===CODE_DEFAUT?"#FFF8E1":C.fond,border:`1px solid ${codeDe(i)===CODE_DEFAUT?C.jaune:C.ligne}`}}>{codeDe(i)}</span></Td><Td r>{s.j}</Td><Td r><b>{fmtH(s.h)}</b></Td><Td><div style={{display:"flex",gap:6,justifyContent:"flex-end"}}><Btn variant="ghost" onClick={()=>ouvrirEdit(i)}>✎ MODIFIER</Btn><Btn variant="danger" onClick={()=>supprimer(i.id)}>SUPPRIMER</Btn></div></Td></tr>;})}</tbody>
        </TableWrap>}
    </Section>
  );
}

// ---- Onglet Chantiers ----
function OngletChantiers({chantiers,setChantiers,pointages}) {
  const auj = new Date().toISOString().slice(0,10);
  const [open,setOpen]=useState(false);

        </div>}
    </Section>
  );
}

              </div>);})}
            </div>)}
          </div>))}
        </div>

            :<SemaineArchive cle={semSel} ptgs={parSemaine[semSel]||[]} salaries={salaries} interimaires={interimaires} chantiers={chantiers} onExport={exportSemaine}/>}
        </div>
      </div>
    </Section>
  );
}

function VueSalarie({session,pointages,chantiers,salaries,interimaires,absences}) {

  const mesPtg=pointages.filter(p=>p.salarie===session.personneId).sort((a,b)=>b.date.localeCompare(a.date));
  const mesAbs=(absences||[]).filter(a=>a.salarie===session.personneId);
  const totalTout=mesPtg.reduce((s,p)=>s+calcHeures(p),0);
  const auj=new Date().toISOString().slice(0,10);
  const semaine=(()=>{const d=new Date(),day=d.getDay()||7;const lundi=new Date(d);lundi.setDate(d.getDate()-day+1);return Array.from({length:7},(_,i)=>{const x=new Date(lundi);x.setDate(lundi.getDate()+i);return x.toISOString().slice(0,10);});})();
  const ptgSem=mesPtg.filter(p=>semaine.includes(p.date));

          {majSem.h50>0&&<div style={{textAlign:"center"}}><div style={{fontSize:9,color:C.gris,letterSpacing:"0.15em",marginBottom:4}}>+50 %</div><div style={{fontFamily:FT,fontSize:28,fontWeight:800,color:C.orange}}>{fmtH(majSem.h50)}</div></div>}

        </div>}
      </div>

        :<div style={{background:C.papier,border:`1.5px solid ${C.encre}`,overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>

          </table>
        </div>}
      <div style={{marginTop:16,padding:"12px 16px",background:"#FFF8E1",border:`1px solid ${C.ligne}`,fontSize:11,color:C.gris}}>🔒 Vous consultez uniquement vos propres heures. Pour toute modification, contactez la RH.</div>
    </main>
  );
}

function OngletParametres({pinRH,setPinRH,pinChef,setPinChef,onChargerDemo,onReloadSupabase,salaries,setSalaries,chantiers,setChantiers,interimaires,setInterimaires,pointages,setPointages,absences,setAbsences}) {
  const [newPinRH,setNewPinRH]=useState("");
  const [newPinChef,setNewPinChef]=useState("");
  const [msgPin,setMsgPin]=useState("");
  const [planningUrl,setPlanningUrl]=useState(getPlanningUrl());
  const [msgPlanning,setMsgPlanning]=useState("");
  const sauverPlanningUrl=()=>{
    const u=(planningUrl||"").trim();
    try{localStorage.setItem("chok_planning_url",u);}catch(e){}
    setMsgPlanning("✓ Lien du planning enregistré.");setTimeout(()=>setMsgPlanning(""),3000);
  };

  const sauverPins=()=>{
    if(newPinRH.length>=4)setPinRH(newPinRH);
    if(newPinChef.length>=4)setPinChef(newPinChef);
    setMsgPin("✓ Codes mis à jour.");setNewPinRH("");setNewPinChef("");
    setTimeout(()=>setMsgPin(""),3000);
  };
  const reinitialiserTout=()=>{
    if(!window.confirm("⚠ Effacer TOUTES les données (pointages, absences, chantiers) ? Les salariés seront conservés."))return;
    setPointages([]);setAbsences([]);setChantiers([]);setInterimaires([]);
  };
  const [msgReset,setMsgReset]=useState("");

  // ---- Serveur Google ----
  const [apiUrl,setApiUrlLocal]=useState(getApiUrl());
  const [msgApi,setMsgApi]=useState("");
  const [testEnCours,setTestEnCours]=useState(false);
  const [nbAttente,setNbAttente]=useState(outboxCount());
  const [envoiEnCours,setEnvoiEnCours]=useState(false);
  const [migrationEnCours,setMigrationEnCours]=useState(false);
  const [msgMigration,setMsgMigration]=useState("");
  useEffect(()=>{ const t=setInterval(()=>setNbAttente(outboxCount()),3000); return ()=>clearInterval(t); },[]);

  const testerServeur=async()=>{
    const u=(apiUrl||"").trim();
    if(!u){setMsgApi("Renseignez d'abord l'adresse.");return;}
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){
      setMsgApi("L'adresse doit ressembler à :\nhttps://script.google.com/macros/s/AKfy…/exec\n(vérifiez qu'elle finit bien par /exec)");return;
    }
    setTestEnCours(true);setMsgApi("");
    const ancienne=getApiUrl();
    try{
      setApiUrl(u);
      const r=await api("ping",{});
      setMsgApi(`✓ Serveur joignable — version ${r.version||"?"}. Cliquez sur ENREGISTRER pour l'utiliser.`);
    }catch(e){
      setApiUrl(ancienne);
      setMsgApi("Échec : "+e.message+"\n\nVérifiez que le déploiement est en accès « Tout le monde » et que l'adresse finit par /exec.");
    }finally{setTestEnCours(false);}
  };

  const enregistrerApiUrl=()=>{
    const u=(apiUrl||"").trim();
    setApiUrl(u);
    setMsgApi(u?"✓ Adresse enregistrée. Rechargez l'application (Ctrl+Maj+R) puis reconnectez-vous.":"✓ Adresse effacée : retour au mode Supabase après rechargement.");
  };

  const forcerEnvoi=async()=>{
    setEnvoiEnCours(true);
    const r=await viderOutbox();
    setNbAttente(outboxCount());
    setEnvoiEnCours(false);
    setMsgApi(r.erreur? "Envoi incomplet : "+r.erreur.message+`\n${r.restants} opération(s) toujours en attente (conservées).`
                      : `✓ ${r.envoyes} opération(s) envoyée(s). File d'attente vide.`);
  };

  const migrerVersGoogle=async()=>{
    setMigrationEnCours(true);setMsgMigration("Lecture des données d'origine…");
    // La source de vérité pour la migration est SUPABASE, pas l'écran courant :
    // en mode Google l'app a déjà rechargé (des tables vides) par-dessus le cache.
    let src={salaries,interimaires,chantiers,pointages,absences}, origine="l'application";
    try{
      const sb=getSb();
      if(sb){
        const [s,i,c,p,a]=await Promise.all([
          sb.from("salaries").select("*"), sb.from("interimaires").select("*"),
          sb.from("chantiers").select("*"), sb.from("pointages").select("*"),
          sb.from("absences").select("*"),
        ]);
        const pioche=(res,repli)=>(!res.error&&res.data&&res.data.length)?listeVersJS(res.data):repli;
        src={ salaries:pioche(s,salaries.length?salaries:REAL_SALARIES),
              interimaires:pioche(i,interimaires), chantiers:pioche(c,chantiers),
              pointages:pioche(p,pointages),       absences:pioche(a,absences) };
        origine="Supabase";
      }
    }catch(e){ /* Supabase injoignable : on retombe sur l'état courant */ }
    if(!src.salaries.length) src.salaries=REAL_SALARIES;

    setMigrationEnCours(false);
    if(!window.confirm(`Transférer vers Google (source : ${origine}) :\n\n`+
      `• ${src.salaries.length} salarié(s)\n• ${src.interimaires.length} intérimaire(s)\n`+
      `• ${src.chantiers.length} chantier(s)\n• ${src.pointages.length} pointage(s)\n`+
      `• ${src.absences.length} absence(s)\n\n`+
      `Le serveur refusera d'écraser des feuilles déjà remplies. Continuer ?`))
      { setMsgMigration(""); return; }
    setMigrationEnCours(true);setMsgMigration("Transfert en cours…");
    try{
      const r=await api("importerTout",{jeton:getJeton(),donnees:Object.assign({},src,{pinRH,pinChef})});
      const lignes=Object.entries(r.rapport||{}).map(([t,d])=>
        d.ignore ? `• ${t} : IGNORÉ (${d.existantes} ligne(s) déjà présentes, ${d.recues} envoyée(s))`
                 : `• ${t} : ${d.importees}/${d.recues} transféré(s) — total sur Google : ${d.total}`);
      const ecarts=Object.entries(r.rapport||{}).filter(([t,d])=>!d.ignore&&d.importees!==d.recues);
      setMsgMigration((ecarts.length?"⚠ Transfert terminé avec des écarts :\n":"✓ Transfert terminé et vérifié :\n")
        +lignes.join("\n")+`\n\nSauvegarde créée : ${r.sauvegarde||"—"}`
        +(ecarts.length?"\n\nCertaines lignes n'ont pas été transférées — ne supprimez rien et prévenez l'administrateur.":"\n\nVos données sont désormais sur Google. Rechargez l'application."));
    }catch(e){
      setMsgMigration("Échec du transfert : "+e.message+"\n\nAucune donnée n'a été perdue : tout est encore dans l'application et sur Supabase.");
    }finally{setMigrationEnCours(false);}
  };
  const remettreHeuresAZero=()=>{
    if(!window.confirm(`⚠ Remettre les HEURES à zéro ?\n\nCela effacera ${pointages.length} pointage(s) et ${absences.length} absence(s) sur TOUS les appareils.\n\nLes salariés, chantiers et intérimaires sont conservés.\n\nCette action est définitive.`))return;
    if(!window.confirm("Dernière confirmation : effacer tous les pointages et absences ?"))return;
    setPointages([]);setAbsences([]);
    setMsgReset("✓ Heures remises à zéro. L'app est prête pour une nouvelle saisie.");
    setTimeout(()=>setMsgReset(""),6000);
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:24}}>

      {/* Codes PIN */}
      <Section titre="Codes d'accès PIN">
        <FormInline>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"flex-end",marginBottom:8}}>
            <Champ label={`CODE RH / ADMIN (actuel : ${"•".repeat(pinRH.length)})`}>
              <input type="password" value={newPinRH} onChange={e=>setNewPinRH(e.target.value)} placeholder="Nouveau code (≥4 chiffres)" style={inputStyle} maxLength={8}/>
            </Champ>
            <Champ label={`CODE CHEF D'ÉQUIPE (actuel : ${"•".repeat(pinChef.length)})`}>
              <input type="password" value={newPinChef} onChange={e=>setNewPinChef(e.target.value)} placeholder="Nouveau code (≥4 chiffres)" style={inputStyle} maxLength={8}/>
            </Champ>
            <Btn onClick={sauverPins} disabled={newPinRH.length<4&&newPinChef.length<4}>METTRE À JOUR</Btn>
          </div>
          {msgPin&&<div style={{color:C.vert,fontSize:12,fontWeight:700}}>{msgPin}</div>}
        </FormInline>
      </Section>

      {/* Serveur Google Apps Script */}
      <Section titre="Serveur Google (hébergement des données)">
        {MODE()==="google"
          ? <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:"#E8F5E9",border:`1px solid ${C.vert}`,fontSize:12,marginBottom:14}}>
              <span style={{fontSize:18}}>🔒</span>
              <div>
                <div style={{fontWeight:700,color:C.vert}}>Mode Google actif</div>
                <div style={{color:C.gris,marginTop:2}}>Les données sont dans votre Google Sheet privé. Aucune clé d'accès n'est présente dans la page. Les codes sont vérifiés par le serveur.</div>
              </div>
            </div>
          : <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",background:"#FFF8E1",border:`1.5px solid ${C.jaune}`,fontSize:12,marginBottom:14}}>
              <span style={{fontSize:18}}>⚠</span>
              <div>
                <div style={{fontWeight:700,color:"#B7770D"}}>Mode Supabase (ancien)</div>
                <div style={{color:C.gris,marginTop:2}}>La clé de la base est visible dans la page : toute personne connaissant l'adresse de l'app peut lire et modifier les données. Renseignez l'adresse du serveur Google ci-dessous pour y remédier.</div>
              </div>
            </div>}
        <FormInline>
          <div style={{fontSize:12,color:C.gris,marginBottom:10,lineHeight:1.5}}>Adresse du déploiement Apps Script. Elle se termine par <code>/exec</code>. Voir la notice <b>GUIDE_MISE_EN_SERVICE.md</b>.</div>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}>
            <Champ label="ADRESSE DU SERVEUR GOOGLE">
              <input type="url" value={apiUrl} onChange={e=>{setApiUrlLocal(e.target.value);setMsgApi("");}} placeholder="https://script.google.com/macros/s/…/exec" style={{...inputStyle,minWidth:420}}/>
            </Champ>
            <Btn variant="ghost" onClick={testerServeur} disabled={testEnCours}>{testEnCours?"TEST…":"⚡ TESTER"}</Btn>
            <Btn onClick={enregistrerApiUrl}>ENREGISTRER</Btn>
          </div>
          {msgApi&&<div style={{marginTop:10,padding:"9px 14px",fontSize:12,fontWeight:600,background:msgApi.startsWith("✓")?"#EAF7F4":"#FFF0F0",border:`1.5px solid ${msgApi.startsWith("✓")?C.vert:C.orange}`,color:msgApi.startsWith("✓")?C.vert:C.orange,whiteSpace:"pre-wrap"}}>{msgApi}</div>}
        </FormInline>
        <div style={{marginTop:14,display:"flex",gap:12,flexWrap:"wrap"}}>
          <Btn variant="ghost" onClick={onReloadSupabase}>⟳ SYNCHRONISER MAINTENANT</Btn>
          {MODE()==="google"&&<Btn variant="ghost" onClick={forcerEnvoi} disabled={envoiEnCours}>{envoiEnCours?"ENVOI…":`📤 ENVOYER LA FILE D'ATTENTE (${nbAttente})`}</Btn>}
        </div>
        {nbAttente>0&&<div style={{marginTop:10,padding:"9px 14px",background:"#FFF8E1",border:`1.5px solid #B7770D`,fontSize:12,fontWeight:600,color:"#B7770D"}}>⏳ {nbAttente} enregistrement(s) en attente d'envoi. Ils sont conservés sur cet appareil : rien n'est perdu, l'envoi se refera automatiquement.</div>}
      </Section>

      {/* Migration vers Google */}
      {MODE()==="google"&&<Section titre="Reprise des données existantes">
        <div style={{padding:"12px 16px",background:C.fond,border:`1.5px solid ${C.ligne}`,fontSize:12,lineHeight:1.6,marginBottom:14}}>
          Va relire <b>directement dans Supabase</b> l'intégralité de vos données d'origine (salariés, intérimaires, chantiers, pointages, absences) et les transfère vers Google. Le décompte exact vous sera montré pour confirmation avant l'envoi.
          <div style={{marginTop:6,color:C.gris}}>Sans risque : le serveur <b>refuse d'écraser</b> une feuille qui contient déjà des données, crée une sauvegarde juste après le transfert, et Supabase reste intact.</div>
        </div>
        <Btn onClick={migrerVersGoogle} disabled={migrationEnCours}>{migrationEnCours?"TRANSFERT EN COURS…":"↗ TRANSFÉRER MES DONNÉES VERS GOOGLE"}</Btn>
        {msgMigration&&<div style={{marginTop:12,padding:"12px 16px",fontSize:12,lineHeight:1.6,background:msgMigration.startsWith("✓")?"#EAF7F4":"#FFF0F0",border:`1.5px solid ${msgMigration.startsWith("✓")?C.vert:C.orange}`,whiteSpace:"pre-wrap"}}>{msgMigration}</div>}
      </Section>}

      {/* Remise à zéro des heures */}
      <Section titre="Remise à zéro des heures">
        <div style={{padding:"14px 16px",background:"#FFF8E1",border:`1.5px solid ${C.jaune}`,marginBottom:14,fontSize:12,lineHeight:1.6,color:C.encre}}>
          👉 À utiliser après vos tests, juste avant le lancement réel : efface tous les pointages et absences pour repartir d'une feuille vierge. <b>Vos salariés, chantiers et intérimaires sont conservés.</b>
        </div>
        <Btn variant="danger" onClick={remettreHeuresAZero}>🧹 REMETTRE LES HEURES À ZÉRO</Btn>
        {msgReset&&<div style={{marginTop:12,color:C.vert,fontSize:13,fontWeight:700}}>{msgReset}</div>}
      </Section>

      {/* Démo + reset */}
      <Section titre="Données">
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
          <Btn variant="ghost" onClick={onChargerDemo}>↓ CHARGER LES DONNÉES DÉMO (chantiers + intérimaires)</Btn>
          <Btn variant="danger" onClick={reinitialiserTout}>✕ RÉINITIALISER POINTAGES & CHANTIERS</Btn>
        </div>
        <div style={{marginTop:12,fontSize:12,color:C.gris,lineHeight:1.7}}>
          • Charger démo : ajoute des chantiers et intérimaires d'exemple (les 33 salariés réels sont déjà présents).<br/>
          • Réinitialiser : efface pointages, absences, chantiers et intérimaires. Les salariés sont conservés.
        </div>
      </Section>
    </div>
  );
}

function VueMobile({chantiers,setChantiers,salaries,interimaires,setInterimaires,pointages,setPointages}) {
  const [etape,setEtape]     = useState("accueil");
  const [chantierSel,setCh]  = useState(null);
  const [chefSel,setChef]    = useState(null);
  const [equipe,setEquipe]   = useState([]);
  const [dateRapport,setDate]= useState(new Date().toISOString().slice(0,10));

  const reset = () => { setEtape("accueil"); setCh(null); setChef(null); setEquipe([]); setDate(new Date().toISOString().slice(0,10)); };

  // 3 options de date
  const optionsDates = Array.from({length:7},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const label = i===0?"Aujourd'hui":i===1?"Hier":i===2?"Avant-hier":d.toLocaleDateString("fr-FR",{weekday:"long"}).charAt(0).toUpperCase()+d.toLocaleDateString("fr-FR",{weekday:"long"}).slice(1);
    const fr = d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
    return {iso,label,fr};
  });

  const sauverMemoire = (chef, chantier, equipeIds) => {
    if (!chef) return;
    save(`chok_last_${chef.id}`, {
      chantierId: chantier.id,
      equipeIds: equipeIds,
      date: dateRapport,
      ts: Date.now(),
    });
  };

  return (
    <main className="phone-shell-outer">
      {/* Téléphone */}
      <div className="phone-shell">
        <div className="phone-notch"/>
        <div className="phone-inner">
          {/* Status bar */}
          <div style={{display:"flex",justifyContent:"space-between",padding:"16px 28px 6px",fontSize:12,fontWeight:700,flexShrink:0}}>
            <Clock/><span>📶 · 🔋</span>
          </div>
          {/* Header mobile */}
          <div style={{padding:"4px 28px 12px",flexShrink:0}}>
            <div style={{fontSize:10,color:C.gris,letterSpacing:"0.2em"}}>RAPPORT HEURE</div>
            <div style={{fontFamily:FT,fontSize:22,fontWeight:800,letterSpacing:"-0.02em",lineHeight:1.1,marginTop:2}}>CHOK BÉTON</div>
          </div>

          {etape==="accueil" && <MAccueil chantiers={chantiers} salaries={salaries} interimaires={interimaires} pointages={pointages} optionsDates={optionsDates} dateRapport={dateRapport} setDate={setDate} onNouveau={()=>setEtape("nouveau-chantier")} onSuite={(ch,chef)=>{setCh(ch);setChef(chef);setEtape("equipe");}}/>}
          {etape==="nouveau-chantier" && <MNouveauChantier onAnnuler={()=>setEtape("accueil")} onCreer={c=>{setChantiers([...chantiers,c]);setEtape("accueil");}}/>}
          {etape==="equipe" && <MEquipe chantier={chantierSel} chef={chefSel} salaries={salaries} interimaires={interimaires} equipe={equipe} setEquipe={setEquipe} onRetour={()=>setEtape("accueil")} onSuite={()=>setEtape("pointage")} onAjoutInt={()=>setEtape("nouveau-interim")}/>}
          {etape==="nouveau-interim" && <MNouvelInt onAnnuler={()=>setEtape("equipe")} onCreer={i=>{setInterimaires([...interimaires,i]);setEquipe([...equipe,{id:i.id,type:"interim",debut:"08:00",fin:"16:00",pause:60}]);setEtape("equipe");}}/>}
          {etape==="pointage" && <MPointage chantier={chantierSel} chef={chefSel} equipe={equipe} setEquipe={setEquipe} salaries={salaries} interimaires={interimaires} dateRapport={dateRapport} onRetour={()=>setEtape("equipe")} onValider={(validationsInt)=>{
            const now=new Date().toISOString();
            const nouveaux=equipe.map(m=>({
              id:genId("P"),salarie:m.id,chantier:chantierSel.id,date:dateRapport,
              debut:m.debut,fin:m.fin,pause:m.pause,commentaire:m.commentaire||"",
              deplacement:!!m.deplacement,
              valide:false,interim:m.type==="interim",
              valideParInterimaire:m.type==="interim"?validationsInt[m.id]===true:null,
              horodatageValidation:m.type==="interim"&&validationsInt[m.id]?now:null,
              chefNom:chefSel?.nom||"—",
            }));
            setPointages([...pointages,...nouveaux]);
            sauverMemoire(chefSel, chantierSel, equipe.map(m=>m.id));
            setEtape("confirm");
          }}/>}
          {etape==="confirm" && <MConfirm chantier={chantierSel} equipe={equipe} dateRapport={dateRapport} onReset={reset}/>}
        </div>
        <div className="phone-bar"/>
      </div>

      {/* Aside desktop */}
      <aside className="phone-aside">
        <div style={{display:"inline-block",fontSize:10,letterSpacing:"0.2em",background:C.encre,color:C.jaune,padding:"5px 10px",fontWeight:700,marginBottom:16}}>VUE CHEF D'ÉQUIPE</div>
        <h3 style={{fontFamily:FT,fontSize:30,fontWeight:800,letterSpacing:"-0.02em",lineHeight:1.1,margin:"0 0 16px"}}>Rapport des heures</h3>
        <p style={{fontSize:14,lineHeight:1.65,marginBottom:20}}>Identifiez-vous, choisissez la date et le chantier, composez l'équipe puis saisissez les horaires de chaque personne.</p>
        {[["1","Me connecter (chef ou intérimaire)"],["2","Choisir la date du rapport"],["3","Sélectionner le chantier"],["4","Composer l'équipe du jour"],["5","Saisir les horaires par personne"],["6","Envoyer pour validation RH"]].map(([n,l])=>(
          <div key={n} style={{fontSize:13,lineHeight:1.6,display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <span style={{width:22,height:22,background:C.encre,color:C.jaune,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{n}</span>{l}
          </div>
        ))}
        <div style={{marginTop:20,padding:"14px 18px",background:C.jaune,fontSize:12,lineHeight:1.6,border:`1.5px solid ${C.encre}`}}>
          💡 L'app mémorise votre dernier chantier et équipe pendant 30 jours.
        </div>
      </aside>
    </main>
  );
}

// ---- Écran Accueil Mobile ----
function MAccueil({chantiers,salaries,interimaires,pointages,optionsDates,dateRapport,setDate,onNouveau,onSuite}) {
  const [chSel,setChSel]   = useState(null);
  const [chefId,setChefId] = useState("");
  const [proposerReprise,setProposerReprise] = useState(false);
  const [dernierRapport,setDernierRapport]   = useState(null);

  // Tracker hebdomadaire — 7 derniers jours
  const auj = new Date().toISOString().slice(0,10);
  const tracker7j = Array.from({length:7},(_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const jour = d.toLocaleDateString("fr-FR",{weekday:"short"}).toUpperCase().slice(0,3);
    const num  = d.getDate();
    const isWE = [0,6].includes(d.getDay());
    const aRapport = pointages.some(p=>p.date===iso);
    const estAuj = iso===auj;
    return {iso,jour,num,isWE,aRapport,estAuj};
  }).reverse();

  const actifs = chantiers.filter(c=>c.actif);
  const tousChefs = [...salaries.map(s=>({...s,_type:"interne"})),...interimaires.map(i=>({...i,_type:"interim"}))];

  // Mémoire par chef
  const onChefChange = (id) => {
    setChefId(id);
    setProposerReprise(false);
    setDernierRapport(null);
    const last = load(`chok_last_${id}`, null);
    if (last && last.ts && (Date.now()-last.ts < 30*24*60*60*1000)) {
      setDernierRapport(last);
      const ch = chantiers.find(c=>c.id===last.chantierId && c.actif);
      if (ch) { setChSel(ch); setProposerReprise(true); }
    }
  };

  const ok = chSel && chefId;
  const trouverChef = (id) => tousChefs.find(p=>p.id===id);

  return (
    <>
      <div style={{overflowY:"auto",flex:1,padding:"0 20px 8px"}}>

        {/* Tracker hebdomadaire */}
        <div style={{marginBottom:14,padding:"12px",background:C.fond,border:`1.5px solid ${C.ligne}`}}>
          <div style={{fontSize:9,color:C.gris,letterSpacing:"0.2em",fontWeight:700,marginBottom:10}}>RAPPORTS — 7 DERNIERS JOURS</div>
          <div style={{display:"flex",gap:4,justifyContent:"space-between"}}>
            {tracker7j.map(t=>(
              <div key={t.iso} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <div style={{fontSize:8,fontWeight:700,color:t.isWE?"#9B5DE5":C.gris,letterSpacing:"0.05em"}}>{t.jour}</div>
                <div style={{width:30,height:30,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:11,border:`2px solid ${t.estAuj?C.encre:t.aRapport?C.vert:t.isWE?"#E0D0F0":"#FFCCCC"}`,background:t.aRapport?C.vert:t.estAuj?"#FFF8E1":"transparent",color:t.aRapport?"#fff":t.estAuj?C.encre:C.gris}}>
                  {t.aRapport?"✓":t.estAuj?"!":t.num}
                </div>
                <div style={{fontSize:8,color:t.aRapport?C.vert:t.estAuj?C.orange:C.gris,fontWeight:700}}>{t.aRapport?"OK":t.estAuj?"À SAISIR":"—"}</div>
              </div>
            ))}
          </div>
          {!tracker7j.find(t=>t.estAuj)?.aRapport && (
            <div style={{marginTop:10,padding:"7px 10px",background:"#FFF0E0",border:`1px solid ${C.orange}`,fontSize:11,color:C.orange,fontWeight:700}}>
              ⚠ Aucun rapport saisi aujourd'hui — pensez à le faire avant la fin de journée !
            </div>
          )}
        </div>

        {/* Chef d'équipe EN PREMIER */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,color:C.gris,letterSpacing:"0.2em",marginBottom:8,fontWeight:700}}>CHEF D'ÉQUIPE</div>
          {tousChefs.length===0
            ? <div style={{padding:"10px 12px",background:"#FFF8E1",border:`1px solid ${C.ligne}`,fontSize:11}}>Aucun salarié. Ajoutez-en depuis l'onglet Admin.</div>
            : <select value={chefId} onChange={e=>onChefChange(e.target.value)} style={{...mInputStyle,width:"100%"}}>
                <option value="" disabled>— Qui êtes-vous ? —</option>
                {salaries.length>0&&<optgroup label="── Salariés CHOK BÉTON">{salaries.map(s=><option key={s.id} value={s.id}>{s.nom}</option>)}</optgroup>}
                {interimaires.length>0&&<optgroup label="── Intérimaires">{interimaires.map(i=>{const ag=AGENCES.find(a=>a.id===i.agence);return<option key={i.id} value={i.id}>{i.nom} · {ag?.nom}</option>;})}</optgroup>}
              </select>
          }
        </div>

        {/* Date du rapport */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,color:C.gris,letterSpacing:"0.2em",marginBottom:8,fontWeight:700}}>DATE DU RAPPORT</div>
          <div style={{display:"flex",gap:6}}>
            {optionsDates.map(opt=>(
              <button key={opt.iso} onClick={()=>setDate(opt.iso)} style={{flex:1,padding:"9px 6px",background:dateRapport===opt.iso?C.encre:C.fond,border:`1.5px solid ${dateRapport===opt.iso?C.encre:C.ligne}`,color:dateRapport===opt.iso?C.jaune:C.encre,fontFamily:FM,fontSize:10,fontWeight:700,cursor:"pointer",textAlign:"center",letterSpacing:"0.05em"}}>
                <div>{opt.label}</div>
                <div style={{fontSize:9,fontWeight:400,marginTop:3,color:dateRapport===opt.iso?C.jaune:C.gris}}>{opt.fr}</div>
              </button>
            ))}
          </div>
          <input type="date" value={dateRapport} max={new Date().toISOString().slice(0,10)} onChange={e=>{ if(e.target.value) setDate(e.target.value); }} style={{marginTop:8,width:"100%",boxSizing:"border-box",padding:"10px 12px",background:C.fond,border:`1.5px solid ${C.ligne}`,fontFamily:FM,fontSize:13,fontWeight:700,color:C.encre,outline:"none"}}/>
          <div style={{fontSize:10,color:C.gris,marginTop:5,fontWeight:600}}>📅 {new Date(dateRapport+"T00:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
        </div>

        {/* Proposition de reprise */}
        {proposerReprise && dernierRapport && (
          <div style={{marginBottom:14,padding:"10px 12px",background:"#FFFDE7",border:`1.5px solid ${C.jaune}`}}>
            <div style={{fontSize:10,color:C.gris,letterSpacing:"0.1em",fontWeight:700,marginBottom:6}}>💡 DERNIER RAPPORT</div>
            <div style={{fontSize:12}}>Chantier : <b>{chantiers.find(c=>c.id===dernierRapport.chantierId)?.nom||"—"}</b></div>
            <div style={{fontSize:11,color:C.gris,marginTop:2}}>{dernierRapport.equipeIds?.length||0} personne(s) · {dernierRapport.date||""}</div>
            <button onClick={()=>setProposerReprise(false)} style={{marginTop:8,fontSize:10,background:"transparent",border:"none",color:C.gris,cursor:"pointer",textDecoration:"underline",padding:0}}>Ignorer</button>
          </div>
        )}

        {/* Chantier du jour */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:10,color:C.gris,letterSpacing:"0.2em",marginBottom:8,fontWeight:700}}>CHANTIER DU JOUR</div>
          {actifs.length===0
            ? <div style={{padding:"10px 12px",background:"#FFF8E1",border:`1px solid ${C.ligne}`,fontSize:11,lineHeight:1.5}}>Aucun chantier actif. Créez-en un ci-dessous ou dans l'onglet Admin.</div>
            : <div style={{display:"flex",flexDirection:"column",gap:7}}>
                {actifs.map(c=>(
                  <button key={c.id} onClick={()=>setChSel(c)} style={{background:chSel?.id===c.id?C.papier:C.fond,border:`1.5px solid ${chSel?.id===c.id?C.encre:C.ligne}`,borderLeft:`5px solid ${c.couleur}`,padding:"10px 12px",cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",fontFamily:FM}}>
                    <div><div style={{fontSize:12,fontWeight:700}}>{c.nom}</div><div style={{fontSize:10,color:C.gris,marginTop:2}}>{c.ville}</div></div>
                    {chSel?.id===c.id&&<span style={{color:C.vert,fontWeight:700}}>✓</span>}
                  </button>
                ))}
              </div>
          }
        </div>
      </div>

      <div style={{flexShrink:0,padding:"0 20px 4px"}}>
        <button onClick={onNouveau} style={{width:"100%",padding:"14px",background:"transparent",border:`2px solid ${C.encre}`,fontFamily:FM,fontSize:12,fontWeight:700,color:C.encre,cursor:"pointer",marginBottom:8,letterSpacing:"0.05em"}}>+ NOUVEAU CHANTIER</button>
        <button disabled={!ok} onClick={()=>ok&&onSuite(chSel,trouverChef(chefId))} style={{width:"100%",padding:"16px",background:ok?C.encre:C.ligne,border:"none",color:ok?C.jaune:C.gris,fontFamily:FM,fontSize:13,fontWeight:700,cursor:ok?"pointer":"not-allowed",letterSpacing:"0.1em",marginBottom:8}}>→ COMPOSER L'ÉQUIPE</button>
      </div>
    </>
  );
}

// ---- Création chantier mobile ----

  </MFormWrap>);
